<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 360" width="100%" height="100%">
  <defs>
    <!-- Arrowhead marker for graph axes -->
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
    <!-- Hatch pattern for shaded area -->
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2" />
    </pattern>
  </defs>

  <style>
    .math-text { font-family: 'Times New Roman', serif; font-size: 24px; fill: #000; }
    .math-italic { font-family: 'Times New Roman', serif; font-size: 24px; font-style: italic; fill: #000; }
    .bengali-text { font-family: 'Kalpurush', 'Siyam Rupali', 'Hind Siliguri', sans-serif; font-size: 22px; font-weight: bold; fill: #000; }
    .sub-text { font-size: 15px; }
    .sup-text { font-size: 15px; }
    .frac-line { stroke: #000; stroke-width: 1.8; stroke-linecap: round; }
    .bracket { stroke: #000; stroke-width: 2; fill: none; stroke-linecap: round; }
    .graph-box { stroke: #000; stroke-width: 1.5; fill: #ffffff; }
    .axis { stroke: #000; stroke-width: 2; stroke-linecap: round; }
    .curve { fill: none; stroke: #000; stroke-width: 2; }
    .dotted-line { stroke: #000; stroke-width: 1.5; stroke-dasharray: 3,3; }
    .graph-label { font-family: 'Times New Roman', serif; font-size: 14px; fill: #000; }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="none" />

  <g transform="translate(15, 20)">
    
    <!-- LEFT MATH SECTION -->
    <g transform="translate(0, 0)">
      
      <!-- LINE 1: y = x² ⇒ x = x² -->
      <g transform="translate(0, 30)">
        <text x="0" y="0" class="math-italic">y <tspan font-style="normal">=</tspan> x<tspan baseline-shift="super" class="sup-text" font-style="normal">2</tspan> &#x21D2; x <tspan font-style="normal">=</tspan> x<tspan baseline-shift="super" class="sup-text" font-style="normal">2</tspan></text>
      </g>

      <!-- LINE 2: ⇒ x (x – 1) = 0 -->
      <g transform="translate(28, 65)">
        <text x="0" y="0" class="math-italic">&#x21D2; x <tspan font-style="normal">( </tspan>x <tspan font-style="normal">– 1 ) = 0</tspan></text>
      </g>

      <!-- LINE 3: ∴ x = 0, 1 -->
      <g transform="translate(28, 100)">
        <text x="0" y="0" class="math-italic">&#x2234; x <tspan font-style="normal">= 0, 1</tspan></text>
      </g>

      <!-- LINE 4: ∴ ক্ষেত্রফল = Integral_0^1 (y1 - y2) dx = Integral_0^1 (x - x²) dx -->
      <g transform="translate(0, 155)">
        <text x="0" y="28" class="bengali-text">&#x2234; ক্ষেত্রফল</text>
        <text x="102" y="28" class="math-text">=</text>

        <!-- Integral 1 -->
        <g transform="translate(115, 0)">
          <text x="0" y="32" font-family="'Times New Roman', serif" font-size="42" fill="#000">∫</text>
          <text x="10" y="6" class="math-text sub-text">1</text>
          <text x="8" y="44" class="math-text sub-text">0</text>

          <text x="22" y="28" class="math-italic">(y<tspan baseline-shift="sub" class="sub-text" font-style="normal">1</tspan> – y<tspan baseline-shift="sub" class="sub-text" font-style="normal">2</tspan>) dx</text>
        </g>

        <text x="235" y="28" class="math-text">=</text>

        <!-- Integral 2 -->
        <g transform="translate(250, 0)">
          <text x="0" y="32" font-family="'Times New Roman', serif" font-size="42" fill="#000">∫</text>
          <text x="10" y="6" class="math-text sub-text">1</text>
          <text x="8" y="44" class="math-text sub-text">0</text>

          <text x="22" y="28" class="math-italic">(x – x<tspan baseline-shift="super" class="sup-text" font-style="normal">2</tspan>) dx</text>
        </g>
      </g>

      <!-- LINE 5: = [ x²/2 - x³/3 ]_0^1 = 1/2 - 1/3 = 1/6 -->
      <g transform="translate(100, 230)">
        <text x="0" y="42" class="math-text">=</text>

        <!-- Bracketed Term [ x²/2 - x³/3 ]_0^1 -->
        <g transform="translate(20, 0)">
          <!-- Left Bracket -->
          <path d="M 8 0 L 0 0 L 0 75 L 8 75" class="bracket" stroke-width="2" />

          <!-- Fraction x²/2 -->
          <g transform="translate(12, 10)">
            <text x="8" y="22" class="math-italic">x<tspan baseline-shift="super" class="sup-text" font-style="normal">2</tspan></text>
            <line x1="0" y1="30" x2="32" y2="30" class="frac-line" />
            <text x="10" y="54" class="math-text">2</text>
          </g>

          <text x="50" y="42" class="math-text">–</text>

          <!-- Fraction x³/3 -->
          <g transform="translate(68, 10)">
            <text x="8" y="22" class="math-italic">x<tspan baseline-shift="super" class="sup-text" font-style="normal">3</tspan></text>
            <line x1="0" y1="30" x2="32" y2="30" class="frac-line" />
            <text x="10" y="54" class="math-text">3</text>
          </g>

          <!-- Right Bracket -->
          <path d="M 108 0 L 116 0 L 116 75 L 108 75" class="bracket" stroke-width="2" />

          <!-- Limits -->
          <text x="120" y="10" class="math-text sub-text">1</text>
          <text x="120" y="75" class="math-text sub-text">0</text>
        </g>

        <!-- = 1/2 - 1/3 = 1/6 -->
        <g transform="translate(255, 0)">
          <text x="0" y="42" class="math-text">=</text>

          <!-- Fraction 1/2 -->
          <g transform="translate(18, 10)">
            <text x="4" y="22" class="math-text">1</text>
            <line x1="0" y1="30" x2="20" y2="30" class="frac-line" />
            <text x="4" y="54" class="math-text">2</text>
          </g>

          <text x="44" y="42" class="math-text">–</text>

          <!-- Fraction 1/3 -->
          <g transform="translate(60, 10)">
            <text x="4" y="22" class="math-text">1</text>
            <line x1="0" y1="30" x2="20" y2="30" class="frac-line" />
            <text x="4" y="54" class="math-text">3</text>
          </g>

          <text x="86" y="42" class="math-text">=</text>

          <!-- Fraction 1/6 -->
          <g transform="translate(104, 10)">
            <text x="4" y="22" class="math-text">1</text>
            <line x1="0" y1="30" x2="20" y2="30" class="frac-line" />
            <text x="4" y="54" class="math-text">6</text>
          </g>
        </g>

      </g>

    </g>

    <!-- RIGHT GRAPH BOX SECTION -->
    <g transform="translate(345, 10)">
      <!-- Outer Border Box -->
      <rect x="0" y="0" width="170" height="150" class="graph-box" />

      <!-- Graph Elements -->
      <g transform="translate(15, 15)">
        
        <!-- Region bounded between y=x and y=x² shaded with hatch -->
        <path d="M 40,80 Q 75,70 100,20 L 40,80 Z" fill="url(#hatch)" />

        <!-- X-Axis -->
        <line x1="5" y1="80" x2="135" y2="80" class="axis" marker-end="url(#axis-arrow)" />
        
        <!-- Y-Axis -->
        <line x1="40" y1="120" x2="40" y2="10" class="axis" marker-end="url(#axis-arrow)" />

        <!-- Line y = x -->
        <line x1="10" y1="110" x2="105" y2="15" class="curve" />

        <!-- Parabola y = x² -->
        <path d="M 40,80 Q 75,80 100,20" class="curve" />
        
        <!-- Parabola extended below/left for full graph feel -->
        <path d="M 40,80 Q 45,105 85,120" class="curve" />

        <!-- Dotted Vertical Line at x = 1 -->
        <line x1="100" y1="20" x2="100" y2="80" class="dotted-line" />

        <!-- Origin Label (0,0) -->
        <text x="45" y="93" class="graph-label">(0,0)</text>

        <!-- Point Label (1,1) -->
        <text x="90" y="95" class="graph-label">(1,1)</text>

      </g>
    </g>

  </g>
</svg>
