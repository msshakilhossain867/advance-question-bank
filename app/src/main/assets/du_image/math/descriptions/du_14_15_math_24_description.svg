<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="100%" height="100%">
  <style>
    .math-text { font-family: 'Times New Roman', serif; font-size: 26px; fill: #000; }
    .frac-line { stroke: #000; stroke-width: 1.8; stroke-linecap: round; }
    .bracket { stroke: #000; stroke-width: 2; fill: none; stroke-linecap: round; }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="none" />

  <g transform="translate(20, 35)">
    
    <!-- LINE 1: cos A + cos C = sin B -->
    <g transform="translate(0, 0)">
      <text x="0" y="24" class="math-text">cos A + cos C = sin B</text>
    </g>

    <!-- LINE 2: ⇒ cos A – cos(A + B) = sin B -->
    <g transform="translate(0, 50)">
      <text x="0" y="24" class="math-text">&#x21D2; cos A – cos(A + B) = sin B</text>
    </g>

    <!-- LINE 3: ⇒ 2 sin ( (2A + B) / 2 ) sin(B / 2) = 2 sin(B / 2) cos(B / 2) -->
    <g transform="translate(0, 105)">
      <text x="0" y="32" class="math-text">&#x21D2; 2 sin</text>

      <!-- Fraction (2A + B) / 2 with Brackets -->
      <g transform="translate(82, 0)">
        <path d="M 8 -5 C 0 -15 0 65 8 55" class="bracket" stroke-width="2" />
        
        <g transform="translate(16, 0)">
          <text x="4" y="20" class="math-text">2A + B</text>
          <line x1="0" y1="28" x2="88" y2="28" class="frac-line" />
          <text x="38" y="52" class="math-text">2</text>
        </g>

        <path d="M 112 -5 C 120 -15 120 65 112 55" class="bracket" stroke-width="2" />
      </g>

      <text x="210" y="32" class="math-text">sin</text>

      <!-- Fraction B / 2 -->
      <g transform="translate(255, 0)">
        <text x="5" y="20" class="math-text">B</text>
        <line x1="0" y1="28" x2="25" y2="28" class="frac-line" />
        <text x="5" y="52" class="math-text">2</text>
      </g>

      <text x="290" y="32" class="math-text">= 2 sin</text>

      <!-- Fraction B / 2 -->
      <g transform="translate(370, 0)">
        <text x="5" y="20" class="math-text">B</text>
        <line x1="0" y1="28" x2="25" y2="28" class="frac-line" />
        <text x="5" y="52" class="math-text">2</text>
      </g>

      <text x="402" y="32" class="math-text">cos</text>

      <!-- Fraction B / 2 -->
      <g transform="translate(452, 0)">
        <text x="5" y="20" class="math-text">B</text>
        <line x1="0" y1="28" x2="25" y2="28" class="frac-line" />
        <text x="5" y="52" class="math-text">2</text>
      </g>
    </g>

    <!-- LINE 4: ⇒ sin ( (2A + B) / 2 ) = cos(B / 2) = sin ( π/2 – B/2 ) -->
    <g transform="translate(0, 185)">
      <text x="0" y="32" class="math-text">&#x21D2; sin</text>

      <!-- Fraction (2A + B) / 2 with Brackets -->
      <g transform="translate(60, 0)">
        <path d="M 8 -5 C 0 -15 0 65 8 55" class="bracket" stroke-width="2" />
        
        <g transform="translate(16, 0)">
          <text x="4" y="20" class="math-text">2A + B</text>
          <line x1="0" y1="28" x2="88" y2="28" class="frac-line" />
          <text x="38" y="52" class="math-text">2</text>
        </g>

        <path d="M 112 -5 C 120 -15 120 65 112 55" class="bracket" stroke-width="2" />
      </g>

      <text x="185" y="32" class="math-text">= cos</text>

      <!-- Fraction B / 2 -->
      <g transform="translate(240, 0)">
        <text x="5" y="20" class="math-text">B</text>
        <line x1="0" y1="28" x2="25" y2="28" class="frac-line" />
        <text x="5" y="52" class="math-text">2</text>
      </g>

      <text x="275" y="32" class="math-text">= sin</text>

      <!-- Fraction Expression with Brackets: ( π/2 - B/2 ) -->
      <g transform="translate(325, 0)">
        <path d="M 8 -5 C 0 -15 0 65 8 55" class="bracket" stroke-width="2" />

        <!-- Fraction π / 2 -->
        <g transform="translate(18, 0)">
          <text x="2" y="20" class="math-text">&#x03C0;</text>
          <line x1="0" y1="28" x2="20" y2="28" class="frac-line" />
          <text x="3" y="52" class="math-text">2</text>
        </g>

        <text x="43" y="32" class="math-text">–</text>

        <!-- Fraction B / 2 -->
        <g transform="translate(63, 0)">
          <text x="5" y="20" class="math-text">B</text>
          <line x1="0" y1="28" x2="25" y2="28" class="frac-line" />
          <text x="5" y="52" class="math-text">2</text>
        </g>

        <path d="M 95 -5 C 103 -15 103 65 95 55" class="bracket" stroke-width="2" />
      </g>
    </g>

    <!-- LINE 5: ⇒ A + B/2 = π/2 – B/2 ⇒ A + B = π/2 ∴ C = π/2 -->
    <g transform="translate(0, 265)">
      <text x="0" y="28" class="math-text">&#x21D2; A +</text>

      <!-- Fraction B / 2 -->
      <g transform="translate(68, 0)">
        <text x="4" y="18" class="math-text">B</text>
        <line x1="0" y1="25" x2="22" y2="25" class="frac-line" />
        <text x="4" y="48" class="math-text">2</text>
      </g>

      <text x="96" y="28" class="math-text">=</text>

      <!-- Fraction π / 2 -->
      <g transform="translate(118, 0)">
        <text x="2" y="18" class="math-text">&#x03C0;</text>
        <line x1="0" y1="25" x2="20" y2="25" class="frac-line" />
        <text x="3" y="48" class="math-text">2</text>
      </g>

      <text x="143" y="28" class="math-text">–</text>

      <!-- Fraction B / 2 -->
      <g transform="translate(163, 0)">
        <text x="4" y="18" class="math-text">B</text>
        <line x1="0" y1="25" x2="22" y2="25" class="frac-line" />
        <text x="4" y="48" class="math-text">2</text>
      </g>

      <text x="195" y="28" class="math-text">&#x21D2; A + B =</text>

      <!-- Fraction π / 2 -->
      <g transform="translate(305, 0)">
        <text x="2" y="18" class="math-text">&#x03C0;</text>
        <line x1="0" y1="25" x2="20" y2="25" class="frac-line" />
        <text x="3" y="48" class="math-text">2</text>
      </g>

      <text x="338" y="28" class="math-text">&#x2234; C =</text>

      <!-- Fraction π / 2 -->
      <g transform="translate(410, 0)">
        <text x="2" y="18" class="math-text">&#x03C0;</text>
        <line x1="0" y1="25" x2="20" y2="25" class="frac-line" />
        <text x="3" y="48" class="math-text">2</text>
      </g>
    </g>

  </g>
</svg>
