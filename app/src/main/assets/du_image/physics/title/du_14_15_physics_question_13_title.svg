<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 320" width="100%" height="100%">
  <style>
    .question-text { font-family: 'Kalpurush', 'Siyam Rupali', 'Hind Siliguri', sans-serif; font-size: 26px; font-weight: bold; fill: #000; }
    .label-text { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #000; }
    .sub-text { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #000; }
    .circuit-line { fill: none; stroke: #000; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Question Text -->
  <text x="20" y="45" class="question-text">পাশের বর্তনীতে R<tspan baseline-shift="sub" font-size="18">3</tspan> এর দুই প্রান্তে বিভব পার্থক্য হচ্ছে-</text>

  <!-- Circuit Diagram Group -->
  <g transform="translate(420, 30)">
    
    <!-- Top Parallel Branch (3 Ohm Resistor) -->
    <path d="M 0,90 L 40,50 L 50,38 L 60,62 L 70,38 L 80,62 L 90,38 L 100,62 L 110,38 L 120,62 L 130,50 L 170,90" class="circuit-line" />
    <text x="85" y="30" class="label-text" text-anchor="middle">3Ω</text>

    <!-- Bottom Parallel Branch (6 Ohm Resistor) -->
    <path d="M 0,90 L 40,120 L 50,108 L 60,132 L 70,108 L 80,132 L 90,108 L 100,132 L 110,108 L 120,132 L 130,120 L 170,90" class="circuit-line" />
    <text x="85" y="160" class="label-text" text-anchor="middle">6Ω</text>

    <!-- Right Vertical Connection -->
    <line x1="170" y1="90" x2="170" y2="230" class="circuit-line" />

    <!-- Bottom Wire with Resistor R3 (8 Ohm) -->
    <!-- Resistor R3 Zigzag -->
    <path d="M 170,230 L 130,230 L 120,218 L 110,242 L 100,218 L 90,242 L 80,218 L 70,242 L 60,218 L 50,230 L 40,230" class="circuit-line" />
    <text x="85" y="210" class="label-text" text-anchor="middle">8Ω</text>
    <text x="85" y="260" class="sub-text" text-anchor="middle">R<tspan baseline-shift="sub" font-size="16">3</tspan></text>

    <!-- Battery (10V) -->
    <line x1="40" y1="230" x2="30" y2="230" class="circuit-line" />
    <!-- Short negative plate -->
    <line x1="30" y1="218" x2="30" y2="242" class="circuit-line" />
    <!-- Long positive plate -->
    <line x1="22" y1="210" x2="22" y2="250" class="circuit-line" stroke-width="3.5" />
    <!-- Short negative plate -->
    <line x1="14" y1="218" x2="14" y2="242" class="circuit-line" />
    <!-- Long positive plate -->
    <line x1="6" y1="210" x2="6" y2="250" class="circuit-line" stroke-width="3.5" />
    <line x1="6" y1="230" x2="0" y2="230" class="circuit-line" />
    
    <text x="20" y="198" class="label-text" text-anchor="middle">10</text>

    <!-- Left Vertical Connection -->
    <line x1="0" y1="230" x2="0" y2="90" class="circuit-line" />

  </g>
</svg>
