<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <style>
    .bengali-text {
      font-family: 'SolaimanLipi', 'Kalpurush', 'Siyam Rupali', 'FreeSerif', 'Arial', sans-serif;
      font-size: 22px;
      fill: #000000;
      font-weight: bold;
    }
    .label-text {
      font-family: 'Times New Roman', Times, serif;
      font-size: 24px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .wire {
      stroke: #000000;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .resistor {
      stroke: #000000;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Bengali Title Text -->
  <text x="20" y="35" class="bengali-text">বর্তনীতে <tspan font-family="Times New Roman, Times, serif" font-size="24px">B</tspan> এবং <tspan font-family="Times New Roman, Times, serif" font-size="24px">C</tspan> বিন্দুর মধ্যে বিভব পার্থক্য কত?</text>

  <!-- Circuit Diagram Group -->
  <g transform="translate(10, 20)">

    <!-- Point Labels A, B, C, D -->
    <text x="100" y="70" class="label-text">A</text>
    <text x="340" y="70" class="label-text">B</text>
    <text x="340" y="270" class="label-text">C</text>
    <text x="100" y="270" class="label-text">D</text>

    <!-- Top Wire with 2 Ohm Resistor (between A and B) -->
    <!-- Wire from A to resistor -->
    <line x1="115" y1="85" x2="200" y2="85" class="wire" />
    <!-- 2 Ohm Resistor -->
    <path d="M 200,85 L 205,75 L 215,95 L 225,75 L 235,95 L 245,75 L 255,95 L 260,85" class="resistor" />
    <!-- Wire from resistor to B -->
    <line x1="260" y1="85" x2="340" y2="85" class="wire" />
    <!-- Label: 2 Ω -->
    <text x="230" y="120" class="label-text">2Ω</text>

    <!-- DC Voltage Source (6V) on the left side (between A and D) -->
    <line x1="115" y1="85" x2="115" y2="155" class="wire" />
    <!-- Battery Long Line (Positive) -->
    <line x1="95" y1="155" x2="135" y2="155" class="wire" />
    <!-- Battery Short Line (Negative) -->
    <line x1="102" y1="167" x2="128" y2="167" stroke="#000000" stroke-width="3.5" />
    <line x1="115" y1="167" x2="115" y2="245" class="wire" />
    <!-- Label: 6 V -->
    <text x="65" y="161" class="label-text">6 V</text>

    <!-- Bottom Wire with 3 Ohm Resistor (between D and C) -->
    <!-- Wire from D to resistor -->
    <line x1="115" y1="245" x2="200" y2="245" class="wire" />
    <!-- 3 Ohm Resistor -->
    <path d="M 200,245 L 205,235 L 215,255 L 225,235 L 235,255 L 245,235 L 255,255 L 260,245" class="resistor" />
    <!-- Wire from resistor to C -->
    <line x1="260" y1="245" x2="340" y2="245" class="wire" />
    <!-- Label: 3 Ω -->
    <text x="230" y="215" class="label-text">3Ω</text>

    <!-- Parallel Branch Connection (from B and C) -->
    <!-- From B split -->
    <line x1="340" y1="85" x2="315" y2="115" class="wire" />
    <line x1="340" y1="85" x2="365" y2="115" class="wire" />
    <line x1="315" y1="115" x2="315" y2="135" class="wire" />
    <line x1="365" y1="115" x2="365" y2="135" class="wire" />

    <!-- Left Parallel Resistor (3 Ω) -->
    <path d="M 315,135 L 305,140 L 325,150 L 305,160 L 325,170 L 305,180 L 325,190 L 315,195" class="resistor" />
    <text x="270" y="165" class="label-text">3Ω</text>

    <!-- Right Parallel Resistor (6 Ω) -->
    <path d="M 365,135 L 355,140 L 375,150 L 355,160 L 375,170 L 355,180 L 375,190 L 365,195" class="resistor" />
    <text x="410" y="165" class="label-text">6Ω</text>

    <!-- Merge back to C -->
    <line x1="315" y1="195" x2="315" y2="215" class="wire" />
    <line x1="365" y1="195" x2="365" y2="215" class="wire" />
    <line x1="315" y1="215" x2="340" y2="245" class="wire" />
    <line x1="365" y1="215" x2="340" y2="245" class="wire" />

  </g>
</svg>
