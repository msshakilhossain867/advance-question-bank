<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 260" width="100%" height="100%">
  <style>
    .bengali-text {
      font-family: 'SolaimanLipi', 'Kalpurush', 'Siyam Rupali', 'FreeSerif', 'Arial', sans-serif;
      font-size: 22px;
      fill: #000000;
      font-weight: bold;
      dominant-baseline: central;
    }
    .label-text {
      font-family: 'Times New Roman', Times, serif;
      font-size: 24px;
      font-weight: bold;
      fill: #000000;
      dominant-baseline: central;
    }
    .wire {
      stroke: #000000;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .bulb-circle {
      stroke: #000000;
      stroke-width: 2.5;
      fill: #ffffff;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Question Text -->
  <g transform="translate(15, 100)">
    <text x="0" y="0" class="bengali-text">পার্শ্বের চিত্রটি কোন লজিক</text>
    <text x="0" y="35" class="bengali-text">গেইটের সমতুল্য বর্তনী?</text>
  </g>

  <!-- Circuit Diagram -->
  <g transform="translate(290, 20)">
    <!-- Main Loop / Wires -->
    <!-- Left Wire from battery going up -->
    <line x1="50" y1="180" x2="50" y2="90" class="wire" />
    <line x1="50" y1="90" x2="80" y2="90" class="wire" />

    <!-- Switch A Branch (Top) -->
    <line x1="80" y1="90" x2="80" y2="40" class="wire" />
    <line x1="80" y1="40" x2="105" y2="40" class="wire" />
    <line x1="105" y1="40" x2="135" y2="25" class="wire" /> <!-- Switch A Arm -->
    <line x1="150" y1="40" x2="190" y2="40" class="wire" />
    <line x1="190" y1="40" x2="190" y2="90" class="wire" />
    <text x="140" y="40" class="label-text">A</text>

    <!-- Switch B Branch (Bottom) -->
    <line x1="80" y1="90" x2="105" y2="90" class="wire" />
    <line x1="105" y1="90" x2="135" y2="75" class="wire" /> <!-- Switch B Arm -->
    <line x1="150" y1="90" x2="190" y2="90" class="wire" />
    <text x="140" y="90" class="label-text">B</text>

    <!-- Right Wire going down -->
    <line x1="190" y1="90" x2="225" y2="90" class="wire" />
    <line x1="225" y1="90" x2="225" y2="180" class="wire" />
    <line x1="225" y1="180" x2="170" y2="180" class="wire" />

    <!-- Bulb -->
    <circle cx="150" cy="180" r="18" class="bulb-circle" />
    <line x1="137" y1="167" x2="163" y2="193" class="wire" />
    <line x1="137" y1="193" x2="163" y2="167" class="wire" />
    <text x="175" y="155" class="bengali-text">বাল্ব</text>

    <!-- Bottom Left Wire to Battery -->
    <line x1="132" y1="180" x2="105" y2="180" class="wire" />

    <!-- Battery -->
    <!-- Long line (+) -->
    <line x1="90" y1="160" x2="90" y2="200" class="wire" stroke-width="3" />
    <!-- Short line (-) -->
    <line x1="105" y1="167" x2="105" y2="193" class="wire" stroke-width="4" />
    <line x1="50" y1="180" x2="90" y2="180" class="wire" />
  </g>
</svg>
