<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 380" width="100%" height="100%">
  <style>
    .wire {
      stroke: #000000;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .text {
      font-family: Arial, sans-serif;
      font-size: 22px;
      font-weight: bold;
      fill: #000000;
    }
    .title-text {
      font-family: 'SolaimanLipi', Arial, sans-serif;
      font-size: 22px;
      font-weight: bold;
      fill: #000000;
    }
    .arrow {
      fill: #000000;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Question Title -->
  <text x="30" y="45" class="title-text">07. নীচের বর্তনীতে তড়িৎপ্রবাহ I<tspan font-size="16" dy="4">1</tspan><tspan font-size="22" dy="-4"> এর মান কত?</tspan></text>

  <g transform="translate(40, 40)">
    <!-- Main Circuit Outer Loop -->
    <!-- Top Wire Left segment -->
    <line x1="80" y1="60" x2="130" y2="60" class="wire" />

    <!-- 5 Ohm Resistor -->
    <path d="M 130,60 L 135,45 L 145,75 L 155,45 L 165,75 L 175,45 L 185,75 L 190,60" class="wire" />
    <text x="160" y="110" class="text" text-anchor="middle">5 Ω</text>

    <!-- Top Wire Middle segment -->
    <line x1="190" y1="60" x2="330" y2="60" class="wire" />

    <!-- Main Current Arrow (0.6 A) -->
    <line x1="240" y1="60" x2="275" y2="60" class="wire" stroke-width="2" />
    <polygon points="275,54 287,60 275,66" class="arrow" />
    <text x="260" y="42" class="text" text-anchor="middle">0.6 A</text>

    <!-- Top Wire Right segment to 30 Ohm branch -->
    <line x1="330" y1="60" x2="430" y2="60" class="wire" />

    <!-- DC Voltage Source (9V) on Left Vertical Wire -->
    <line x1="80" y1="60" x2="80" y2="140" class="wire" />
    
    <!-- Battery Long Line (+) -->
    <line x1="60" y1="140" x2="100" y2="140" class="wire" stroke-width="3" />
    <!-- Battery Short Line (-) -->
    <line x1="70" y1="152" x2="90" y2="152" class="wire" stroke-width="4" />
    
    <text x="102" y="138" class="text">+</text>
    <text x="96" y="165" class="text">-</text>
    <text x="45" y="180" class="text" text-anchor="end">9 V</text>

    <line x1="80" y1="152" x2="80" y2="280" class="wire" />

    <!-- Bottom Wire -->
    <line x1="80" y1="280" x2="430" y2="280" class="wire" />

    <!-- Middle Branch (R, I1) -->
    <line x1="330" y1="60" x2="330" y2="120" class="wire" />
    <!-- Resistor R -->
    <path d="M 330,120 L 315,125 L 345,135 L 315,145 L 345,155 L 315,165 L 345,175 L 330,180" class="wire" />
    <text x="295" y="155" class="text" text-anchor="end">R</text>
    <line x1="330" y1="180" x2="330" y2="280" class="wire" />

    <!-- Arrow for I1 -->
    <line x1="330" y1="220" x2="330" y2="245" class="wire" stroke-width="2" />
    <polygon points="324,245 330,257 336,245" class="arrow" />
    <text x="310" y="242" class="text" text-anchor="end">I<tspan font-size="16" dy="4">1</tspan></text>

    <!-- Right Branch (30 Ohm, I2) -->
    <line x1="430" y1="60" x2="430" y2="120" class="wire" />
    <!-- Resistor 30 Ohm -->
    <path d="M 430,120 L 415,125 L 445,135 L 415,145 L 445,155 L 415,165 L 445,175 L 430,180" class="wire" />
    <text x="415" y="155" class="text" text-anchor="end" transform="rotate(-90 410,155)">30 Ω</text>
    <line x1="430" y1="180" x2="430" y2="280" class="wire" />

    <!-- Arrow for I2 -->
    <line x1="430" y1="220" x2="430" y2="245" class="wire" stroke-width="2" />
    <polygon points="424,245 430,257 436,245" class="arrow" />
    <text x="450" y="242" class="text">I<tspan font-size="16" dy="4">2</tspan></text>
  </g>
</svg>
