<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <style>
    .label {
      font-family: "Times New Roman", Times, serif;
      font-size: 24px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .axis {
      stroke: #000000;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .curve {
      stroke: #000000;
      stroke-width: 2.5;
      stroke-linecap: round;
      fill: none;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <g transform="translate(50, 20)">
    <!-- Y-Axis -->
    <line x1="50" y1="30" x2="50" y2="220" class="axis" />
    <text x="30" y="110" class="label">V</text>

    <!-- X-Axis -->
    <line x1="50" y1="220" x2="240" y2="220" class="axis" />
    <text x="250" y="225" class="label">T</text>

    <!-- Hyperbolic Curve (V vs T inverse relationship curve) -->
    <path d="M 70,40 C 70,140 120,190 220,195" class="curve" />
  </g>
</svg>
