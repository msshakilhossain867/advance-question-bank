<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="100%" height="100%">
  <!-- Left Hexagon -->
  <polygon points="45,10 80,30 80,70 45,90 10,70 10,30" 
           fill="none" 
           stroke="black" 
           stroke-width="5" 
           stroke-linejoin="round"/>

  <!-- Right Hexagon -->
  <polygon points="115,10 150,30 150,70 115,90 80,70 80,30" 
           fill="none" 
           stroke="black" 
           stroke-width="5" 
           stroke-linejoin="round"/>

  <!-- Left Aromatic Ring Circle -->
  <circle cx="45" cy="50" r="22" 
          fill="none" 
          stroke="black" 
          stroke-width="5"/>

  <!-- Right Aromatic Ring Circle -->
  <circle cx="115" cy="50" r="22" 
          fill="none" 
          stroke="black" 
          stroke-width="5"/>
</svg>
