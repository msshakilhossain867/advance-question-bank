<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" width="100%" height="100%">
  <!-- Outer Pyrrole Ring Structure -->
  <path d="M 20,10 L 80,10 L 80,45 L 50,60 L 20,45 Z" 
        fill="none" 
        stroke="black" 
        stroke-width="3" 
        stroke-linejoin="round" 
        stroke-linecap="round"/>

  <!-- Left Double Bond Line -->
  <line x1="26" y1="18" x2="26" y2="40" 
        stroke="black" 
        stroke-width="3" 
        stroke-linecap="round"/>

  <!-- Right Double Bond Line -->
  <line x1="74" y1="18" x2="74" y2="40" 
        stroke="black" 
        stroke-width="3" 
        stroke-linecap="round"/>

  <!-- Nitrogen (N) Atom Text -->
  <text x="50" y="72" 
        font-family="Arial, sans-serif" 
        font-size="16" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="black">N</text>

  <!-- N-H Single Bond Line -->
  <line x1="50" y1="76" x2="50" y2="92" 
        stroke="black" 
        stroke-width="3" 
        stroke-linecap="round"/>

  <!-- Hydrogen (H) Atom Text -->
  <text x="50" y="112" 
        font-family="Arial, serif" 
        font-size="18" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="black">H</text>
</svg>
