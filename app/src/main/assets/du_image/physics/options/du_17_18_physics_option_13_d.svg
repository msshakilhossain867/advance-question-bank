<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="100%" height="100%">
  <style>
    .label-text {
      font-family: 'Times New Roman', Times, serif;
      font-size: 26px;
      font-style: italic;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .axis {
      stroke: #000000;
      stroke-width: 3;
      stroke-linecap: round;
      fill: none;
    }
    .graph-line {
      stroke: #000000;
      stroke-width: 3;
      stroke-linecap: round;
      fill: none;
    }
    .arrow-head {
      fill: #000000;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <g transform="translate(40, 20)">
    <!-- Y-axis (v) -->
    <line x1="50" y1="180" x2="50" y2="30" class="axis" />
    <polygon points="43,35 50,20 57,35" class="arrow-head" />
    <text x="25" y="45" class="label-text">v</text>

    <!-- X-axis (t) -->
    <line x1="50" y1="180" x2="200" y2="180" class="axis" />
    <polygon points="195,173 210,180 195,187" class="arrow-head" />
    <text x="125" y="205" class="label-text">t</text>

    <!-- Upward Curve for Increasing Acceleration -->
    <path d="M 50,180 Q 120,175 155,45" class="graph-line" />
  </g>
</svg>
