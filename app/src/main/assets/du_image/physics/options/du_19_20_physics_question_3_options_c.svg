<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 350" width="100%" height="100%">
  <style>
    .axis {
      stroke: #000000;
      stroke-width: 2.5;
      stroke-linecap: round;
      fill: none;
    }
    .wave {
      stroke: #000000;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .text {
      font-family: Arial, sans-serif;
      font-size: 24px;
      font-weight: bold;
      fill: #000000;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="none" />

  <g transform="translate(30, 20)">
    <!-- Y-axis (x) -->
    <line x1="50" y1="20" x2="50" y2="280" class="axis" />

    <!-- X-axis (t) -->
    <line x1="50" y1="160" x2="280" y2="160" class="axis" />

    <!-- Sine Wave Path -->
    <path d="M 50,160 C 80,60 110,60 140,160 C 170,260 200,260 230,160" class="wave" />

    <!-- Axis Labels -->
    <text x="20" y="50" class="text">x</text>
    <text x="270" y="200" class="text">t</text>
  </g>
</svg>
