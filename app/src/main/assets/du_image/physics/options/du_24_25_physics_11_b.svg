<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="black" />
    </marker>
  </defs>

  <!-- Common Pivot Point -->
  <!-- Pendulum e -->
  <line x1="80" y1="10" x2="25" y2="78" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="25" cy="78" r="4" fill="black"/>
  <text x="12" y="86" font-family="Times New Roman, serif" font-size="16" font-style="italic" text-anchor="middle" fill="black">e</text>

  <!-- Pendulum d -->
  <line x1="80" y1="10" x2="48" y2="114" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="48" cy="114" r="4" fill="black"/>
  <text x="32" y="138" font-family="Times New Roman, serif" font-size="16" font-style="italic" text-anchor="middle" fill="black">d</text>
  <!-- Arrow on d -->
  <line x1="48" y1="114" x2="33" y2="92" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pendulum c -->
  <line x1="80" y1="10" x2="80" y2="128" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="80" cy="128" r="4" fill="black"/>
  <text x="80" y="152" font-family="Times New Roman, serif" font-size="16" font-style="italic" text-anchor="middle" fill="black">c</text>
  <!-- Arrow on c -->
  <line x1="80" y1="128" x2="54" y2="128" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pendulum b -->
  <line x1="80" y1="10" x2="112" y2="120" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="112" cy="120" r="4" fill="black"/>
  <text x="126" y="142" font-family="Times New Roman, serif" font-size="16" font-style="italic" text-anchor="middle" fill="black">b</text>
  <!-- Arrow on b -->
  <line x1="112" y1="120" x2="88" y2="126" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pendulum a -->
  <line x1="80" y1="10" x2="135" y2="105" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="135" cy="105" r="4" fill="black"/>
  <text x="148" y="118" font-family="Times New Roman, serif" font-size="16" font-style="italic" text-anchor="middle" fill="black">a</text>
</svg>
