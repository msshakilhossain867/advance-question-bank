<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Marker for arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="black"/>
    </marker>
  </defs>

  <!-- Y-axis (v) -->
  <line x1="60" y1="210" x2="60" y2="45" stroke="black" stroke-width="4" stroke-linecap="square" marker-end="url(#arrow)" />

  <!-- X-axis (s) -->
  <line x1="60" y1="210" x2="255" y2="210" stroke="black" stroke-width="4" stroke-linecap="square" marker-end="url(#arrow)" />

  <!-- Curve line -->
  <path d="M 60,140 L 170,140 Q 200,140 205,210" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" />

  <!-- Y-axis label: v -->
  <text x="32" y="65" font-family="serif" font-size="28" font-weight="bold" font-style="italic">v</text>

  <!-- X-axis label: s -->
  <text x="225" y="250" font-family="serif" font-size="28" font-weight="bold" font-style="italic">s</text>
</svg>
