<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <style>
    .label {
      font-family: "Times New Roman", Times, serif;
      font-size: 26px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .axis {
      stroke: #000000;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .curve {
      stroke: #000000;
      stroke-width: 2.5;
      stroke-linecap: round;
      fill: none;
    }
    .arrow-head {
      fill: #000000;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="none" />

  <g transform="translate(40, 20)">
    <!-- Y-Axis (s) with Arrow -->
    <line x1="50" y1="50" x2="50" y2="220" class="axis" />
    <polygon points="44,50 50,35 56,50" class="arrow-head" />
    <text x="25" y="125" class="label">s</text>

    <!-- X-Axis (t) with Arrow -->
    <line x1="50" y1="220" x2="220" y2="220" class="axis" />
    <polygon points="220,214 235,220 220,226" class="arrow-head" />
    <text x="250" y="225" class="label">t</text>

    <!-- Curve (s vs t graph showing decreasing slope/deceleration) -->
    <path d="M 50,220 C 70,140 130,80 210,50" class="curve" />
  </g>
</svg>
