<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="black" />
    </marker>
  </defs>

  <!-- Vertical Axis (W) -->
  <line x1="20" y1="100" x2="20" y2="20" 
        stroke="black" 
        stroke-width="3" 
        marker-end="url(#arrow)"/>

  <!-- Horizontal Axis (V) -->
  <line x1="20" y1="100" x2="100" y2="100" 
        stroke="black" 
        stroke-width="3" 
        marker-end="url(#arrow)"/>

  <!-- Curved Graph Line (Downward Concave / Leveling Off Curve) -->
  <path d="M 20,100 Q 30,40 80,35" 
        fill="none" 
        stroke="black" 
        stroke-width="3" 
        stroke-linecap="round"/>

  <!-- Vertical Axis Label W -->
  <text x="20" y="12" 
        font-family="Times New Roman, serif" 
        font-size="18" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="black">W</text>

  <!-- Horizontal Axis Label V -->
  <text x="110" y="105" 
        font-family="Times New Roman, serif" 
        font-size="18" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="black">V</text>
</svg>
