<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 780" width="100%" height="100%" style="background-color: #ffffff;">
  <defs>
    <!-- Arrowhead marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .plate { stroke: #000000; stroke-width: 3; stroke-linecap: round; }
    .dielectric { fill: #f0f0f0; stroke: #000000; stroke-width: 2; }
    .dim-line { stroke: #000000; stroke-width: 1.5; }
    .math { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 20px; fill: #000000; }
    .math-italic { font-style: italic; }
    .sub { font-size: 14px; font-style: normal; }
  </style>

  <!-- ==================== TOP: DIAGRAM GROUP ==================== -->
  <g id="capacitor-diagram" transform="translate(65, 20)">
    <!-- Left Capacitor Plate -->
    <line x1="60" y1="20" x2="60" y2="210" class="plate"/>

    <!-- Middle Slab -->
    <rect x="180" y="10" width="40" height="210" class="dielectric"/>

    <!-- Right Capacitor Plate -->
    <line x1="340" y1="20" x2="340" y2="210" class="plate"/>

    <!-- Top Dimensions (d/4, d/2, d/4) -->
    <line x1="63" y1="120" x2="177" y2="120" class="dim-line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="120" y="112" class="math math-italic" text-anchor="middle">d/4</text>

    <text x="200" y="120" class="math math-italic" text-anchor="middle" style="font-size: 17px;">d/2</text>

    <line x1="223" y1="120" x2="337" y2="120" class="dim-line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="280" y="112" class="math math-italic" text-anchor="middle">d/4</text>

    <!-- Middle Labels (C1, C2) -->
    <line x1="63" y1="180" x2="337" y2="180" class="dim-line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="120" y="172" class="math" text-anchor="middle"><tspan class="math-italic">C</tspan><tspan baseline-shift="sub" class="sub">1</tspan></text>
    <text x="280" y="172" class="math" text-anchor="middle"><tspan class="math-italic">C</tspan><tspan baseline-shift="sub" class="sub">2</tspan></text>

    <!-- Bottom Bracket for C and d -->
    <path d="M 60 225 Q 60 240 200 240 Q 340 240 340 225" fill="none" stroke="#000000" stroke-width="1.5"/>
    <path d="M 200 240 L 200 248" fill="none" stroke="#000000" stroke-width="1.5"/>
    <text x="150" y="265" class="math math-italic" text-anchor="middle">C</text>
    <text x="200" y="288" class="math math-italic" text-anchor="middle">d</text>
  </g>

  <!-- ==================== BOTTOM: FORMULAS GROUP ==================== -->
  <g id="math-derivations" transform="translate(30, 320)">
    
    <!-- Line 1: Original C, C1, C2 definitions -->
    <g transform="translate(0, 30)">
      <text x="0" y="20" class="math">=</text>
      
      <!-- C = eps0 * A / d -->
      <g transform="translate(15, 0)">
        <text x="20" y="10" class="math" text-anchor="middle">ε<tspan baseline-shift="sub" class="sub">0</tspan><tspan class="math-italic">A</tspan></text>
        <line x1="0" y1="18" x2="40" y2="18" stroke="#000000" stroke-width="1.5"/>
        <text x="20" y="38" class="math" text-anchor="middle"><tspan class="math-italic">d</tspan></text>
      </g>

      <text x="60" y="20" class="math">,</text>

      <!-- C1 = eps0 * A / (d/4) = 4 * eps0 * A / d -->
      <text x="75" y="20" class="math"><tspan class="math-italic">C</tspan><tspan baseline-shift="sub" class="sub">1</tspan> =</text>
      <g transform="translate(110, 0)">
        <text x="25" y="10" class="math" text-anchor="middle">ε<tspan baseline-shift="sub" class="sub">0</tspan><tspan class="math-italic">A</tspan></text>
        <line x1="0" y1="18" x2="50" y2="18" stroke="#000000" stroke-width="1.5"/>
        <text x="25" y="38" class="math" text-anchor="middle"><tspan class="math-italic">d</tspan> / 4</text>
      </g>

      <text x="167" y="20" class="math">=</text>
      <g transform="translate(182, 0)">
        <text x="30" y="10" class="math" text-anchor="middle">4 ε<tspan baseline-shift="sub" class="sub">0</tspan><tspan class="math-italic">A</tspan></text>
        <line x1="0" y1="18" x2="60" y2="18" stroke="#000000" stroke-width="1.5"/>
        <text x="30" y="38" class="math" text-anchor="middle"><tspan class="math-italic">d</tspan></text>
      </g>

      <text x="247" y="20" class="math">,</text>

      <!-- C2 = 4 * eps0 * A / d -->
      <text x="260" y="20" class="math"><tspan class="math-italic">C</tspan><tspan baseline-shift="sub" class="sub">2</tspan> =</text>
      <g transform="translate(295, 0)">
        <text x="30" y="10" class="math" text-anchor="middle">4 ε<tspan baseline-shift="sub" class="sub">0</tspan><tspan class="math-italic">A</tspan></text>
        <line x1="0" y1="18" x2="60" y2="18" stroke="#000000" stroke-width="1.5"/>
        <text x="30" y="38" class="math" text-anchor="middle"><tspan class="math-italic">d</tspan></text>
      </g>
    </g>

    <!-- Line 2: In Series Equation -->
    <g transform="translate(0, 130)">
      <text x="0" y="35" class="math" style="font-style: italic;">series</text>
      <text x="50" y="35" class="math">:</text>
      <text x="60" y="35" class="math"><tspan class="math-italic">C</tspan><tspan baseline-shift="sub" class="sub">eq</tspan> =</text>

      <!-- C1*C2 / (C1+C2) -->
      <g transform="translate(110, 0)">
        <text x="40" y="18" class="math" text-anchor="middle"><tspan class="math-italic">C</tspan><tspan baseline-shift="sub" class="sub">1</tspan><tspan class="math-italic">C</tspan><tspan baseline-shift="sub" class="sub">2</tspan></text>
        <line x1="0" y1="26" x2="80" y2="26" stroke="#000000" stroke-width="1.5"/>
        <text x="40" y="48" class="math" text-anchor="middle"><tspan class="math-italic">C</tspan><tspan baseline-shift="sub" class="sub">1</tspan> + <tspan class="math-italic">C</tspan><tspan baseline-shift="sub" class="sub">2</tspan></text>
      </g>

      <text x="198" y="35" class="math">=</text>

      <!-- Large Fraction -->
      <g transform="translate(215, 0)">
        <!-- Numerator -->
        <g transform="translate(0, -10)">
          <text x="30" y="10" class="math" text-anchor="middle">4 ε<tspan baseline-shift="sub" class="sub">0</tspan><tspan class="math-italic">A</tspan></text>
          <line x1="0" y1="18" x2="60" y2="18" stroke="#000000" stroke-width="1.2"/>
          <text x="30" y="35" class="math" text-anchor="middle"><tspan class="math-italic">d</tspan></text>

          <text x="70" y="22" class="math">×</text>

          <g transform="translate(85, 0)">
            <text x="30" y="10" class="math" text-anchor="middle">4 ε<tspan baseline-shift="sub" class="sub">0</tspan><tspan class="math-italic">A</tspan></text>
            <line x1="0" y1="18" x2="60" y2="18" stroke="#000000" stroke-width="1.2"/>
            <text x="30" y="35" class="math" text-anchor="middle"><tspan class="math-italic">d</tspan></text>
          </g>
        </g>

        <!-- Main Fraction Line -->
        <line x1="-5" y1="31" x2="150" y2="31" stroke="#000000" stroke-width="1.8"/>

        <!-- Denominator -->
        <g transform="translate(0, 42)">
          <text x="30" y="10" class="math" text-anchor="middle">4 ε<tspan baseline-shift="sub" class="sub">0</tspan><tspan class="math-italic">A</tspan></text>
          <line x1="0" y1="18" x2="60" y2="18" stroke="#000000" stroke-width="1.2"/>
          <text x="30" y="35" class="math" text-anchor="middle"><tspan class="math-italic">d</tspan></text>

          <text x="70" y="22" class="math">+</text>

          <g transform="translate(85, 0)">
            <text x="30" y="10" class="math" text-anchor="middle">4 ε<tspan baseline-shift="sub" class="sub">0</tspan><tspan class="math-italic">A</tspan></text>
            <line x1="0" y1="18" x2="60" y2="18" stroke="#000000" stroke-width="1.2"/>
            <text x="30" y="35" class="math" text-anchor="middle"><tspan class="math-italic">d</tspan></text>
          </g>
        </g>
      </g>
    </g>

    <!-- Line 3: Final Result -->
    <g transform="translate(130, 260)">
      <text x="0" y="20" class="math">=</text>

      <g transform="translate(15, 0)">
        <text x="30" y="10" class="math" text-anchor="middle">2 ε<tspan baseline-shift="sub" class="sub">0</tspan><tspan class="math-italic">A</tspan></text>
        <line x1="0" y1="18" x2="60" y2="18" stroke="#000000" stroke-width="1.5"/>
        <text x="30" y="38" class="math" text-anchor="middle"><tspan class="math-italic">d</tspan></text>
      </g>

      <text x="82" y="20" class="math">= 2<tspan class="math-italic">C</tspan></text>
    </g>

  </g>
</svg>
