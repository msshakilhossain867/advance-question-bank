<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" width="100%" height="100%">
  <defs>
    <!-- Galvanometer Fill -->
    <radialGradient id="galvo-grad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#a0a0a0" />
      <stop offset="100%" stop-color="#606060" />
    </radialGradient>
  </defs>

  <style>
    .math-text { font-family: 'Times New Roman', serif; font-size: 24px; fill: #000; }
    .math-italic { font-family: 'Times New Roman', serif; font-size: 24px; font-style: italic; fill: #000; }
    .bengali-text { font-family: 'Kalpurush', 'Siyam Rupali', 'Hind Siliguri', sans-serif; font-size: 20px; font-weight: bold; fill: #000; }
    .sub-text { font-size: 15px; }
    .sup-text { font-size: 15px; }
    .frac-line { stroke: #000; stroke-width: 1.8; stroke-linecap: round; }
    .circuit-line { stroke: #000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .galvo-circle { fill: url(#galvo-grad); stroke: #000; stroke-width: 2; }
    .galvo-text { font-family: 'Times New Roman', serif; font-size: 26px; font-weight: bold; fill: #000; }
    .resistor-zigzag { fill: none; stroke: #000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="none" />

  <g transform="translate(15, 15)">

    <!-- WHEATSTONE BRIDGE CIRCUIT DIAGRAM -->
    <g transform="translate(40, 10)">

      <!-- Bridge Outer Diamond Wires -->
      <line x1="170" y1="10" x2="60" y2="90" class="circuit-line" />   <!-- Top-Left -->
      <line x1="170" y1="10" x2="280" y2="90" class="circuit-line" />  <!-- Top-Right -->
      <line x1="60" y1="90" x2="170" y2="170" class="circuit-line" />  <!-- Bottom-Left -->
      <line x1="280" y1="90" x2="170" y2="170" class="circuit-line" /> <!-- Bottom-Right -->

      <!-- Galvanometer Branch -->
      <line x1="170" y1="10" x2="170" y2="170" class="circuit-line" />
      <circle cx="170" cy="90" r="28" class="galvo-circle" />
      <text x="170" y="98" class="galvo-text" text-anchor="middle">G</text>

      <!-- Resistor P (Top-Left Arm) -->
      <g transform="translate(115, 50) rotate(-36)">
        <rect x="-18" y="-12" width="36" height="24" fill="#ffffff" />
        <path d="M -18,0 L -12,-8 L -4,8 L 4,-8 L 12,8 L 18,0" class="resistor-zigzag" />
      </g>
      <text x="95" y="32" class="math-italic">P</text>

      <!-- Resistor Q (Top-Right Arm) -->
      <g transform="translate(225, 50) rotate(36)">
        <rect x="-18" y="-12" width="36" height="24" fill="#ffffff" />
        <path d="M -18,0 L -12,-8 L -4,8 L 4,-8 L 12,8 L 18,0" class="resistor-zigzag" />
      </g>
      <text x="235" y="32" class="math-italic">Q</text>

      <!-- Resistor R (Bottom-Left Arm) -->
      <g transform="translate(115, 130) rotate(36)">
        <rect x="-18" y="-12" width="36" height="24" fill="#ffffff" />
        <path d="M -18,0 L -12,-8 L -4,8 L 4,-8 L 12,8 L 18,0" class="resistor-zigzag" />
      </g>
      <text x="95" y="155" class="math-italic">R</text>

      <!-- Parallel Resistors S (Bottom-Right Arm) -->
      <g transform="translate(225, 130) rotate(-36)">
        <!-- Background Eraser Box -->
        <rect x="-24" y="-22" width="48" height="44" fill="#ffffff" />
        
        <!-- Top Parallel Resistor Wire & Zigzag -->
        <path d="M -22,0 L -16,-12 L 16,-12 L 22,0" class="circuit-line" />
        <path d="M -10,-12 L -6,-18 L -2,-6 L 2,-18 L 6,-6 L 10,-12" class="resistor-zigzag" />
        
        <!-- Bottom Parallel Resistor Wire & Zigzag -->
        <path d="M -22,0 L -16,12 L 16,12 L 22,0" class="circuit-line" />
        <path d="M -10,12 L -6,6 L -2,18 L 2,6 L 6,18 L 10,12" class="resistor-zigzag" />
      </g>
      <text x="245" y="155" class="math-italic">S</text>

      <!-- Battery Circuit External Wires -->
      <line x1="60" y1="90" x2="10" y2="90" class="circuit-line" />
      <line x1="10" y1="90" x2="10" y2="210" class="circuit-line" />
      <line x1="10" y1="210" x2="155" y2="210" class="circuit-line" />

      <line x1="280" y1="90" x2="330" y2="90" class="circuit-line" />
      <line x1="330" y1="90" x2="330" y2="210" class="circuit-line" />
      <line x1="330" y1="210" x2="185" y2="210" class="circuit-line" />

      <!-- DC Battery Symbol (E) -->
      <line x1="155" y1="195" x2="155" y2="225" class="circuit-line" /> <!-- Long Positive Plate -->
      <line x1="170" y1="202" x2="170" y2="218" class="circuit-line" stroke-width="3" /> <!-- Short Negative Plate -->
      <line x1="185" y1="195" x2="185" y2="225" class="circuit-line" /> <!-- Long Plate -->
      
      <text x="170" y="250" class="math-italic" text-anchor="middle">E</text>

    </g>

    <!-- CALCULATIONS & TEXT SECTION -->
    <g transform="translate(10, 275)">

      <!-- LINE 1: ⇒ P/R = Q/S -->
      <g transform="translate(0, 0)">
        <text x="0" y="24" class="math-text">&#x21D2;</text>
        
        <!-- P/R -->
        <g transform="translate(25, 0)">
          <text x="5" y="18" class="math-italic">P</text>
          <line x1="0" y1="26" x2="22" y2="26" class="frac-line" />
          <text x="5" y="50" class="math-italic">R</text>
        </g>

        <text x="55" y="24" class="math-text">=</text>

        <!-- Q/S -->
        <g transform="translate(78, 0)">
          <text x="4" y="18" class="math-italic">Q</text>
          <line x1="0" y1="26" x2="22" y2="26" class="frac-line" />
          <text x="5" y="50" class="math-italic">S</text>
        </g>
      </g>

      <!-- LINE 2: ⇒ 1000/2000 = 10/S -->
      <g transform="translate(0, 65)">
        <text x="0" y="24" class="math-text">&#x21D2;</text>

        <!-- 1000/2000 -->
        <g transform="translate(25, 0)">
          <text x="2" y="18" class="math-text">1000</text>
          <line x1="0" y1="26" x2="52" y2="26" class="frac-line" />
          <text x="2" y="50" class="math-text">2000</text>
        </g>

        <text x="85" y="24" class="math-text">=</text>

        <!-- 10/S -->
        <g transform="translate(108, 0)">
          <text x="3" y="18" class="math-text">10</text>
          <line x1="0" y1="26" x2="28" y2="26" class="frac-line" />
          <text x="8" y="50" class="math-italic">S</text>
        </g>
      </g>

      <!-- LINE 3: S = 20 Ω -->
      <g transform="translate(0, 135)">
        <text x="0" y="0" class="math-italic">S <tspan font-style="normal">= 20&#x03A9;</tspan></text>
      </g>

      <!-- LINE 4: চতুর্থ বাহুতে একই ধাতুর দুইটি সমান্তরাল তার যুক্ত করা আছে। -->
      <g transform="translate(0, 170)">
        <text x="0" y="0" class="bengali-text">চতুর্থ বাহুতে একই ধাতুর দুইটি সমান্তরাল তার যুক্ত করা আছে।</text>
      </g>

      <!-- LINE 5: সুতরাং চতুর্থ বাহুর তুল্যরোধ, R/2 = 20 Ω ∴ R = 40 Ω -->
      <g transform="translate(0, 205)">
        <text x="0" y="22" class="bengali-text">সুতরাং চতুর্থ বাহুর তুল্যরোধ,</text>

        <!-- R/2 -->
        <g transform="translate(235, -2)">
          <text x="5" y="18" class="math-italic">R</text>
          <line x1="0" y1="24" x2="22" y2="24" class="frac-line" />
          <text x="6" y="46" class="math-text">2</text>
        </g>

        <text x="265" y="22" class="math-text">= 20&#x03A9; &#x2234;</text>
        <text x="330" y="22" class="math-italic">R <tspan font-style="normal">= 40&#x03A9;</tspan></text>
      </g>

      <!-- LINE 6: ⇒ R = ρL/A ⇒ ρ = RA/L = 40 × 10⁻⁶ Ωm. -->
      <g transform="translate(0, 255)">
        <text x="0" y="24" class="math-text">&#x21D2;</text>
        <text x="20" y="24" class="math-italic">R</text>
        <text x="40" y="24" class="math-text">=</text>

        <!-- ρL / A -->
        <g transform="translate(60, 0)">
          <text x="3" y="18" class="math-italic">&#x03C1;L</text>
          <line x1="0" y1="26" x2="30" y2="26" class="frac-line" />
          <text x="7" y="50" class="math-italic">A</text>
        </g>

        <text x="98" y="24" class="math-text">&#x21D2;</text>
        <text x="122" y="24" class="math-italic">&#x03C1;</text>
        <text x="140" y="24" class="math-text">=</text>

        <!-- RA / L -->
        <g transform="translate(160, 0)">
          <text x="3" y="18" class="math-italic">RA</text>
          <line x1="0" y1="26" x2="35" y2="26" class="frac-line" />
          <text x="11" y="50" class="math-italic">L</text>
        </g>

        <text x="202" y="24" class="math-text">= 40 &#x00D7; 10<tspan baseline-shift="super" class="sup-text">–6</tspan>&#x03A9;m.</text>
      </g>

    </g>

  </g>
</svg>
