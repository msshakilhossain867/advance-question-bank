<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', Times, serif;">
  <!-- Definitions for Markers and Styles -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
  </defs>

  <!-- DIAGRAM SECTION -->
  <g transform="translate(0, 20)">
    <!-- Base / Tower Structure -->
    <rect x="130" y="160" width="15" height="110" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <line x1="130" y1="270" x2="145" y2="270" stroke="#000000" stroke-width="2"/>

    <!-- Reference Level / Dotted Line -->
    <line x1="145" y1="270" x2="450" y2="270" stroke="#000000" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Horizontal Launch Line -->
    <line x1="130" y1="160" x2="450" y2="160" stroke="#000000" stroke-width="1.5"/>

    <!-- Parabolic Projectile Trajectory -->
    <path d="M 130 160 Q 250 50 450 160 T 475 290" fill="none" stroke="#000000" stroke-width="2"/>

    <!-- Launch Angle Alpha (α) Arc -->
    <path d="M 160 160 A 30 30 0 0 0 148 142" fill="none" stroke="#000000" stroke-width="1.5"/>
    <text x="170" y="150" font-size="20" font-style="italic">α</text>

    <!-- Impact/Landing Angle Alpha (α) Arc -->
    <line x1="450" y1="160" x2="480" y2="240" stroke="#000000" stroke-width="1.5" stroke-dasharray="2,2"/>
    <path d="M 450 190 A 30 30 0 0 0 468 180" fill="none" stroke="#000000" stroke-width="1.5"/>
    <text x="465" y="210" font-size="20" font-style="italic">α</text>

    <!-- Vertical Fall Vector / Line -->
    <line x1="450" y1="160" x2="450" y2="285" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Dimension T (Time of Flight for horizontal level) -->
    <line x1="130" y1="30" x2="450" y2="30" stroke="#000000" stroke-width="1.5"/>
    <line x1="130" y1="20" x2="130" y2="160" stroke="#000000" stroke-width="1.5"/>
    <line x1="450" y1="20" x2="450" y2="160" stroke="#000000" stroke-width="1.5"/>
    <text x="285" y="25" font-size="22" font-style="italic" text-anchor="middle">T</text>

    <!-- Dimension 5m Bracket (Left) -->
    <path d="M 115 160 C 100 160 100 215 85 215 C 100 215 100 270 115 270" fill="none" stroke="#000000" stroke-width="1.5"/>
    <text x="70" y="222" font-size="20" text-anchor="end">5m</text>

    <!-- Dimension t Bracket (Right) -->
    <path d="M 470 160 C 485 160 485 225 500 225 C 485 225 485 290 470 290" fill="none" stroke="#000000" stroke-width="1.5"/>
    <text x="515" y="232" font-size="22" font-style="italic">t</text>
  </g>

  <!-- MATHEMATICAL CALCULATION SECTION -->
  <g transform="translate(40, 340)" font-size="18" fill="#000000">
    <!-- Equation 1 -->
    <text x="0" y="30">
      <tspan font-style="italic">h</tspan> = -<tspan font-style="italic">u</tspan><tspan font-style="italic">t</tspan> + 
      <tspan font-size="14" dy="-6">1</tspan><tspan font-size="14" dy="6">/</tspan><tspan font-size="14" dy="4">2</tspan><tspan font-size="18" dy="-4"> </tspan>
      <tspan font-style="italic">g</tspan><tspan font-style="italic">t</tspan><tspan font-size="12" dy="-8">2</tspan><tspan font-size="18" dy="8"> = -20 sin(30°) </tspan>
      <tspan font-style="italic">t</tspan> + 
      <tspan font-size="14" dy="-6">1</tspan><tspan font-size="14" dy="6">/</tspan><tspan font-size="14" dy="4">2</tspan><tspan font-size="18" dy="-4"> × 9.8 × </tspan>
      <tspan font-style="italic">t</tspan><tspan font-size="12" dy="-8">2</tspan>
    </text>

    <!-- Height substitution line -->
    <text x="0" y="70">
      ⇒ 5 = -20(0.5)<tspan font-style="italic">t</tspan> + 4.9<tspan font-style="italic">t</tspan><tspan font-size="12" dy="-8">2</tspan>
    </text>

    <!-- Quadratic Form -->
    <text x="0" y="110">
      ⇒ 4.9<tspan font-style="italic">t</tspan><tspan font-size="12" dy="-8">2</tspan><tspan font-size="18" dy="8"> - 10</tspan><tspan font-style="italic">t</tspan> - 5 = 0
    </text>

    <!-- Quadratic Formula Step -->
    <text x="0" y="160">
      ∴ <tspan font-style="italic">t</tspan> = 
    </text>

    <!-- Fraction line and quadratic formula -->
    <g transform="translate(35, 125)">
      <!-- Numerator -->
      <text x="110" y="18" text-anchor="middle">
        10 ± <tspan font-size="18">√(10² - 4 × 4.9 × (-5))</tspan>
      </text>
      <!-- Division Line -->
      <line x1="0" y1="26" x2="220" y2="26" stroke="#000000" stroke-width="1.5"/>
      <!-- Denominator -->
      <text x="110" y="46" text-anchor="middle">2 × 4.9</text>

      <text x="235" y="24">=</text>

      <!-- Simplified fraction -->
      <text x="300" y="18" text-anchor="middle">10 ± √198</text>
      <line x1="255" y1="26" x2="345" y2="26" stroke="#000000" stroke-width="1.5"/>
      <text x="300" y="46" text-anchor="middle">9.8</text>
    </g>

    <!-- Final Result -->
    <g transform="translate(0, 220)">
      <text x="0" y="20">
        ∴ <tspan font-style="italic">t</tspan> = 
      </text>

      <g transform="translate(35, -15)">
        <text x="45" y="18" text-anchor="middle">10 + √198</text>
        <line x1="0" y1="26" x2="90" y2="26" stroke="#000000" stroke-width="1.5"/>
        <text x="45" y="46" text-anchor="middle">9.8</text>
      </g>

      <text x="140" y="20" font-size="16" fill="#333333">
        [ ঋণাত্মক মান গ্রহণযোগ্য নয় / Negative value is omitted ]
      </text>

      <!-- Evaluated Answer -->
      <text x="0" y="70" font-weight="bold" fill="#000000">
        ⇒ <tspan font-style="italic">t</tspan> ≈ 2.455 seconds
      </text>
    </g>
  </g>
</svg>
