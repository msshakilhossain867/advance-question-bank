<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" width="100%" height="100%">
  <style>
    .bengali-text {
      font-family: 'SolaimanLipi', 'Kalpurush', 'Siyam Rupali', 'FreeSerif', 'Arial', sans-serif;
      font-size: 24px;
      fill: #000000;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .axis-label {
      font-family: 'SolaimanLipi', 'Kalpurush', 'Siyam Rupali', 'FreeSerif', 'Arial', sans-serif;
      font-size: 18px;
      fill: #000000;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .grid-line {
      stroke: #000000;
      stroke-width: 2;
      fill: none;
    }
    .axis {
      stroke: #000000;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .graph-line {
      stroke: #000000;
      stroke-width: 2.5;
      stroke-linecap: round;
      fill: none;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Outer Border & Table Grids -->
  <rect x="20" y="20" width="560" height="620" class="grid-line" />
  <line x1="260" y1="20" x2="260" y2="640" class="grid-line" />
  <line x1="20" y1="220" x2="580" y2="220" class="grid-line" />
  <line x1="20" y1="420" x2="580" y2="420" class="grid-line" />

  <!-- SECTION 1: Zero Order Reaction -->
  <g id="zero-order">
    <text x="140" y="120" class="bengali-text">শূন্য ক্রম বিক্রিয়া</text>
    
    <!-- Graph -->
    <g transform="translate(320, 20)">
      <!-- Axes -->
      <line x1="60" y1="30" x2="60" y2="160" class="axis" />
      <line x1="60" y1="160" x2="210" y2="160" class="axis" />
      <!-- Labels -->
      <text x="35" y="95" class="axis-label" transform="rotate(-90, 35, 95)">ঘনমাত্রা</text>
      <text x="135" y="180" class="axis-label">সময়</text>
      <!-- Straight Line with Negative Slope -->
      <line x1="65" y1="45" x2="175" y2="145" class="graph-line" />
    </g>
  </g>

  <!-- SECTION 2: First Order Reaction -->
  <g id="first-order">
    <text x="140" y="320" class="bengali-text">১ম ক্রম বিক্রিয়া</text>

    <!-- Graph -->
    <g transform="translate(320, 220)">
      <!-- Axes -->
      <line x1="60" y1="30" x2="60" y2="160" class="axis" />
      <line x1="60" y1="160" x2="210" y2="160" class="axis" />
      <!-- Labels -->
      <text x="35" y="95" class="axis-label" transform="rotate(-90, 35, 95)">ঘনমাত্রা</text>
      <text x="135" y="180" class="axis-label">সময়</text>
      <!-- Exponential Decay Curve -->
      <path d="M 65,45 C 70,110 100,140 165,148" class="graph-line" />
    </g>
  </g>

  <!-- SECTION 3: Second Order Reaction -->
  <g id="second-order">
    <text x="140" y="520" class="bengali-text">২য় ক্রম বিক্রিয়া</text>

    <!-- Graph -->
    <g transform="translate(320, 420)">
      <!-- Axes -->
      <line x1="60" y1="30" x2="60" y2="160" class="axis" />
      <line x1="60" y1="160" x2="210" y2="160" class="axis" />
      <!-- Labels -->
      <text x="35" y="95" class="axis-label" transform="rotate(-90, 35, 95)">ঘনমাত্রা</text>
      <text x="135" y="180" class="axis-label">সময়</text>
      <!-- Steeper Curve -->
      <path d="M 65,45 C 68,125 105,152 180,145" class="graph-line" />
    </g>
  </g>
</svg>
