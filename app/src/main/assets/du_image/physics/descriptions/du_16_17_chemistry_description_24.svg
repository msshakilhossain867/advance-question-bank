<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 480" width="100%" height="100%">
  <style>
    .bengali-text {
      font-family: 'SolaimanLipi', 'Kalpurush', 'Siyam Rupali', 'FreeSerif', 'Arial', sans-serif;
      font-size: 22px;
      fill: #000000;
      font-weight: bold;
      dominant-baseline: central;
    }
    .chem-text {
      font-family: 'Times New Roman', Times, serif;
      font-size: 24px;
      font-weight: bold;
      fill: #000000;
      dominant-baseline: central;
      text-anchor: middle;
    }
    .bond {
      stroke: #000000;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .bullet-icon {
      fill: #000000;
      stroke: #000000;
      stroke-width: 1;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Chemical Structure Group -->
  <g transform="translate(10, 10)">
    <!-- Top H to C1 -->
    <text x="120" y="30" class="chem-text">H</text>
    <line x1="120" y1="42" x2="120" y2="65" class="bond" />

    <!-- C1=O -->
    <text x="103" y="75" class="chem-text" font-size="18px">1</text>
    <text x="120" y="80" class="chem-text">C</text>
    <line x1="135" y1="75" x2="165" y2="75" class="bond" />
    <line x1="135" y1="83" x2="165" y2="83" class="bond" />
    <text x="180" y="80" class="chem-text">O</text>

    <!-- C1 to C2 -->
    <line x1="120" y1="95" x2="120" y2="130" class="bond" />

    <!-- C2 row -->
    <text x="60" y="140" class="chem-text">H</text>
    <line x1="75" y1="140" x2="105" y2="140" class="bond" />
    <text x="103" y="135" class="chem-text" font-size="18px">2</text>
    <text x="120" y="140" class="chem-text">C</text>
    <line x1="135" y1="140" x2="165" y2="140" class="bond" />
    <text x="190" y="140" class="chem-text">OH</text>

    <!-- C2 to C3 -->
    <line x1="120" y1="155" x2="120" y2="190" class="bond" />

    <!-- C3 row -->
    <text x="50" y="200" class="chem-text">OH</text>
    <line x1="75" y1="200" x2="105" y2="200" class="bond" />
    <text x="103" y="195" class="chem-text" font-size="18px">3</text>
    <text x="120" y="200" class="chem-text">C</text>
    <line x1="135" y1="200" x2="165" y2="200" class="bond" />
    <text x="180" y="200" class="chem-text">H</text>

    <!-- C3 to C4 -->
    <line x1="120" y1="215" x2="120" y2="250" class="bond" />

    <!-- C4 row -->
    <text x="60" y="260" class="chem-text">H</text>
    <line x1="75" y1="260" x2="105" y2="260" class="bond" />
    <text x="103" y="255" class="chem-text" font-size="18px">4</text>
    <text x="120" y="260" class="chem-text">C</text>
    <line x1="135" y1="260" x2="165" y2="260" class="bond" />
    <text x="190" y="260" class="chem-text">OH</text>

    <!-- C4 to C5 -->
    <line x1="120" y1="275" x2="120" y2="310" class="bond" />

    <!-- C5 row -->
    <text x="60" y="320" class="chem-text">H</text>
    <line x1="75" y1="320" x2="105" y2="320" class="bond" />
    <text x="103" y="315" class="chem-text" font-size="18px">5</text>
    <text x="120" y="320" class="chem-text">C</text>
    <line x1="135" y1="320" x2="165" y2="320" class="bond" />
    <text x="190" y="320" class="chem-text">OH</text>

    <!-- C5 to C6 -->
    <line x1="120" y1="335" x2="120" y2="370" class="bond" />

    <!-- C6 row -->
    <text x="60" y="380" class="chem-text">H</text>
    <line x1="75" y1="380" x2="105" y2="380" class="bond" />
    <text x="103" y="375" class="chem-text" font-size="18px">6</text>
    <text x="120" y="380" class="chem-text">C</text>
    <line x1="135" y1="380" x2="165" y2="380" class="bond" />
    <text x="190" y="380" class="chem-text">OH</text>

    <!-- C6 to Bottom H -->
    <line x1="120" y1="395" x2="120" y2="420" class="bond" />
    <text x="120" y="435" class="chem-text">H</text>
  </g>

  <!-- Explanatory Text Section -->
  <g transform="translate(230, 70)">
    <!-- Point 1 -->
    <polygon points="0,0 12,0 12,12 0,12" class="bullet-icon" transform="translate(0, 0)" />
    <polygon points="0,0 6,0 0,6" fill="#ffffff" transform="translate(0, 0)" />
    <text x="25" y="8" class="bengali-text">
      এখানে 1 নং কার্বনে কোন <tspan class="chem-text" font-size="22px">-OH</tspan> গ্রুপ নাই
    </text>

    <!-- Point 2 -->
    <g transform="translate(0, 50)">
      <polygon points="0,0 12,0 12,12 0,12" class="bullet-icon" />
      <polygon points="0,0 6,0 0,6" fill="#ffffff" />
      <text x="25" y="8" class="bengali-text">
        2 থেকে 5 নং পর্যন্ত 4 টি কার্বনে 2°
      </text>
      <text x="0" y="40" class="bengali-text">
        (সেকেন্ডারী) অ্যালকোহল গ্রুপ যুক্ত
      </text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(0, 150)">
      <polygon points="0,0 12,0 12,12 0,12" class="bullet-icon" />
      <polygon points="0,0 6,0 0,6" fill="#ffffff" />
      <text x="25" y="8" class="bengali-text">
        6 নং কার্বনে অ্যালকোহল 1°
      </text>
      <text x="0" y="40" class="bengali-text">
        (<tspan class="chem-text" font-size="22px">-OH</tspan>) গ্রুপ যুক্ত
      </text>
    </g>
  </g>
</svg>
