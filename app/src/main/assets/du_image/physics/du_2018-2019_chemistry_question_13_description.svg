<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Kalpurush', 'Siyam Rupali', 'Times New Roman', serif;">
  <style>
    .bengali-text { font-family: 'Kalpurush', 'Siyam Rupali', serif; font-size: 18px; fill: #000000; }
    .chem-text { font-family: 'Times New Roman', serif; font-size: 22px; fill: #000000; }
    .ox-number { font-family: 'Times New Roman', serif; font-size: 16px; fill: #000000; }
    .subscript { font-size: 14px; }
    .arrow-line { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linejoin: round; stroke-linecap: round; }
  </style>

  <!-- Bullet Point 1 -->
  <circle cx="50" cy="30" r="4" fill="#000000" />
  <text x="65" y="36" class="bengali-text" font-weight="bold">জারণ: <tspan font-weight="normal">জারণ সংখ্যা বৃদ্ধি পায়</tspan></text>

  <!-- Bullet Point 2 -->
  <circle cx="50" cy="70" r="4" fill="#000000" />
  <text x="65" y="76" class="bengali-text" font-weight="bold">বিজারণ: <tspan font-weight="normal">জারণ সংখ্যা হ্রাস পায়</tspan></text>

  <!-- Top Oxidation Arrow & Label -->
  <text x="280" y="105" class="bengali-text" text-anchor="middle">জারণ</text>
  <path d="M 160 142 L 160 115 L 430 115 L 430 132" class="arrow-line" />
  <polygon points="426,130 430,139 434,130" fill="#000000" />

  <!-- Chemical Equation Row -->
  <g transform="translate(0, 165)">
    <!-- Reactant: 2KNO3 -->
    <!-- Oxidation Numbers -->
    <text x="110" y="-12" class="ox-number">+1</text>
    <text x="130" y="-12" class="ox-number">+5</text>
    <text x="150" y="-12" class="ox-number">-2</text>
    <!-- Compound Text -->
    <text x="95" y="10" class="chem-text">2KNO<tspan baseline-shift="sub" class="subscript">3</tspan></text>

    <!-- Reaction Arrow -->
    <line x1="180" y1="3" x2="310" y2="3" class="arrow-line" />
    <polygon points="308,-1 317,3 308,7" fill="#000000" />

    <!-- Product 1: 2KNO2 (Note: Written as 2KNO3 with typo in original text) -->
    <!-- Oxidation Numbers -->
    <text x="335" y="-12" class="ox-number">+1</text>
    <text x="355" y="-12" class="ox-number">+3</text>
    <text x="375" y="-12" class="ox-number">-2</text>
    <!-- Compound Text -->
    <text x="320" y="10" class="chem-text">2KNO<tspan baseline-shift="sub" class="subscript">3</tspan></text>

    <!-- Plus Sign -->
    <text x="402" y="8" class="chem-text">+</text>

    <!-- Product 2: O2 -->
    <!-- Oxidation Number -->
    <text x="428" y="-12" class="ox-number">0</text>
    <!-- Compound Text -->
    <text x="420" y="10" class="chem-text">O<tspan baseline-shift="sub" class="subscript">2</tspan></text>
  </g>

  <!-- Bottom Reduction Arrow & Label -->
  <path d="M 135 180 L 135 205 L 358 205 L 358 188" class="arrow-line" />
  <polygon points="354,190 358,181 362,190" fill="#000000" />
  <text x="245" y="228" class="bengali-text" text-anchor="middle">বিজারণ</text>
</svg>
