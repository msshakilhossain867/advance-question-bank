<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="100%" height="100%">
  <style>
    .label-text {
      font-family: 'Times New Roman', Times, serif;
      font-size: 26px;
      font-style: italic;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .axis {
      stroke: #000000;
      stroke-width: 2.5;
      stroke-linecap: round;
      fill: none;
    }
    .graph-line {
      stroke: #000000;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="none" />

  <g transform="translate(30, 20)">
    <!-- Y-axis (x) -->
    <line x1="30" y1="20" x2="30" y2="180" class="axis" />
    <text x="12" y="35" class="label-text">x</text>

    <!-- X-axis (t) -->
    <line x1="30" y1="120" x2="250" y2="120" class="axis" />
    <text x="235" y="140" class="label-text">t</text>

    <!-- Sinusoidal Curve Path -->
    <path d="M 30,120 C 50,40 80,40 100,120 C 120,200 150,200 170,120 L 240,120" class="graph-line" />
  </g>
</svg>
