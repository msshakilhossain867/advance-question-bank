<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" style="background-color: #ffffff;">
  <style>
    .circle { fill: none; stroke: #000000; stroke-width: 2.2; }
    .arrow { stroke: #000000; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  </style>

  <!-- Circle 1: Up and Down Arrows -->
  <g transform="translate(35, 40)">
    <circle cx="0" cy="0" r="26" class="circle" />
    <!-- Up Arrow -->
    <line x1="-7" y1="15" x2="-7" y2="-15" class="arrow" />
    <path d="M -13 -7 L -7 -15 L -1 -7" class="arrow" />
    <!-- Down Arrow -->
    <line x1="7" y1="-15" x2="7" y2="15" class="arrow" />
    <path d="M 1 7 L 7 15 L 13 7" class="arrow" />
  </g>

  <!-- Circle 2: Up and Down Arrows -->
  <g transform="translate(90, 40)">
    <circle cx="0" cy="0" r="26" class="circle" />
    <!-- Up Arrow -->
    <line x1="-7" y1="15" x2="-7" y2="-15" class="arrow" />
    <path d="M -13 -7 L -7 -15 L -1 -7" class="arrow" />
    <!-- Down Arrow -->
    <line x1="7" y1="-15" x2="7" y2="15" class="arrow" />
    <path d="M 1 7 L 7 15 L 13 7" class="arrow" />
  </g>

  <!-- Circle 3: Up and Down Arrows -->
  <g transform="translate(145, 40)">
    <circle cx="0" cy="0" r="26" class="circle" />
    <!-- Up Arrow -->
    <line x1="-7" y1="15" x2="-7" y2="-15" class="arrow" />
    <path d="M -13 -7 L -7 -15 L -1 -7" class="arrow" />
    <!-- Down Arrow -->
    <line x1="7" y1="-15" x2="7" y2="15" class="arrow" />
    <path d="M 1 7 L 7 15 L 13 7" class="arrow" />
  </g>

  <!-- Circle 4: Single Up Arrow -->
  <g transform="translate(200, 40)">
    <circle cx="0" cy="0" r="26" class="circle" />
    <!-- Up Arrow -->
    <line x1="0" y1="15" x2="0" y2="-15" class="arrow" />
    <path d="M -6 -7 L 0 -15 L 6 -7" class="arrow" />
  </g>

  <!-- Circle 5: Single Up Arrow -->
  <g transform="translate(255, 40)">
    <circle cx="0" cy="0" r="26" class="circle" />
    <!-- Up Arrow -->
    <line x1="0" y1="15" x2="0" y2="-15" class="arrow" />
    <path d="M -6 -7 L 0 -15 L 6 -7" class="arrow" />
  </g>
</svg>
