<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <style>
    .text { font-family: 'Times New Roman', serif; font-size: 38px; fill: black; }
    .label { font-family: 'Times New Roman', serif; font-size: 34px; font-style: italic; fill: black; }
    .border { stroke: black; stroke-width: 4; fill: none; }
    .curve { stroke: black; stroke-width: 5; fill: none; stroke-linecap: round; }
  </style>

  <!-- Left axis label [A] -->
  <text x="35" y="100" class="text">[A]</text>

  <!-- Outer bounding rectangle box -->
  <rect x="140" y="30" width="220" height="170" class="border" />

  <!-- Outer exponential decay curve -->
  <path d="M 160, 45 Q 170, 140 230, 160" class="curve" />

  <!-- Inner exponential decay curve -->
  <path d="M 148, 80 Q 155, 145 190, 175" class="curve" />

  <!-- Bottom axis label t -->
  <text x="238" y="240" class="label">t</text>
</svg>
