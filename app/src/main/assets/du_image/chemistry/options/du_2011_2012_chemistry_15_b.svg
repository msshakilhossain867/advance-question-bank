<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <style>
    .text { font-family: 'Times New Roman', serif; font-size: 38px; fill: black; }
    .label { font-family: 'Times New Roman', serif; font-size: 34px; font-style: italic; fill: black; }
    .border { stroke: black; stroke-width: 4; fill: none; }
    .line { stroke: black; stroke-width: 5; fill: none; stroke-linecap: round; }
  </style>

  <!-- Left axis label ln[A] -->
  <text x="20" y="100" class="text">ln[A]</text>

  <!-- Outer bounding rectangle box -->
  <rect x="140" y="30" width="220" height="170" class="border" />

  <!-- Positively sloped linear line inside the box -->
  <line x1="140" y1="180" x2="225" y2="105" class="line" />

  <!-- Bottom axis label t -->
  <text x="238" y="240" class="label">t</text>
</svg>
