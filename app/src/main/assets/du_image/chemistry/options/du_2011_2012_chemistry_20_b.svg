<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="100%" height="100%">
  <style>
    .text {
      font-family: "Times New Roman", Times, serif;
      font-size: 36px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .bond {
      stroke: #000000;
      stroke-width: 2.5;
      stroke-linecap: round;
    }
    .dot {
      fill: #000000;
    }
  </style>

  <!-- Top H -->
  <text x="120" y="35" class="text">H</text>

  <!-- Top Bond -->
  <line x1="120" y1="58" x2="120" y2="98" class="bond" />

  <!-- Left H -->
  <text x="52" y="125" class="text">H</text>

  <!-- Left Bond -->
  <line x1="72" y1="125" x2="96" y2="125" class="bond" />

  <!-- Center C -->
  <text x="120" y="125" class="text">C</text>

  <!-- Right Pair of Dots (Lone Pair) -->
  <circle cx="140" cy="118" r="2.5" class="dot" />
  <circle cx="140" cy="132" r="2.5" class="dot" />

  <!-- Bottom Bond -->
  <line x1="120" y1="152" x2="120" y2="192" class="bond" />

  <!-- Bottom H -->
  <text x="120" y="215" class="text">H</text>
</svg>
