<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <style>
    .text { font-family: 'Times New Roman', serif; font-size: 38px; fill: black; }
    .subscript { font-family: 'Times New Roman', serif; font-size: 24px; fill: black; }
    .label { font-family: 'Times New Roman', serif; font-size: 34px; font-style: italic; fill: black; }
    .border { stroke: black; stroke-width: 4; fill: none; }
    .line { stroke: black; stroke-width: 5; fill: none; stroke-linecap: round; }
    .fraction-line { stroke: black; stroke-width: 3; }
  </style>

  <!-- Left axis label ln([A]0/[A]) -->
  <!-- ln text -->
  <text x="15" y="105" class="text">ln</text>

  <!-- Fraction numerator [A]0 -->
  <text x="58" y="72" class="text">[A]</text>
  <text x="100" y="82" class="subscript">0</text>

  <!-- Fraction horizontal bar -->
  <line x1="55" y1="88" x2="115" y2="88" class="fraction-line" />

  <!-- Fraction denominator [A] -->
  <text x="64" y="130" class="text">[A]</text>

  <!-- Outer bounding rectangle box -->
  <rect x="145" y="30" width="210" height="170" class="border" />

  <!-- Positively sloped linear line inside the box -->
  <line x1="145" y1="170" x2="245" y2="90" class="line" />

  <!-- Bottom axis label t -->
  <text x="240" y="245" class="label">t</text>
</svg>
