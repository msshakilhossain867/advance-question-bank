<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <style>
    .label { font-family: 'Times New Roman', serif; font-size: 38px; font-style: italic; fill: black; }
    .border { stroke: black; stroke-width: 4; fill: none; }
    .line { stroke: black; stroke-width: 5; fill: none; stroke-linecap: round; }
  </style>

  <!-- Left axis label PV -->
  <text x="35" y="125" class="label">PV</text>

  <!-- Outer bounding rectangle box -->
  <rect x="140" y="30" width="220" height="170" class="border" />

  <!-- Horizontal linear line inside the box -->
  <line x1="140" y1="80" x2="315" y2="80" class="line" />

  <!-- Bottom axis label P -->
  <text x="238" y="245" class="label">P</text>
</svg>
