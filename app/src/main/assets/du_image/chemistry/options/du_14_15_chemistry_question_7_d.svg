<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 180" width="100%" height="100%">
  <style>
    .chem-text { font-family: 'Times New Roman', serif; font-size: 30px; fill: #000; }
    .sub-text { font-size: 20px; }
    .sup-text { font-size: 20px; }
    .bond { fill: none; stroke: #000; stroke-width: 2.5; stroke-linecap: round; }
  </style>

  <!-- H3N+ group -->
  <g transform="translate(15, 60)">
    <text x="0" y="0" class="chem-text">H<tspan baseline-shift="sub" class="sub-text">3</tspan>N<tspan baseline-shift="super" class="sup-text">+</tspan></text>
  </g>

  <!-- Bond between H3N+ and CH -->
  <line x1="100" y1="50" x2="135" y2="50" class="bond" />

  <!-- CH group -->
  <g transform="translate(145, 60)">
    <text x="0" y="0" class="chem-text">CH</text>
  </g>

  <!-- Bond between CH and COOH -->
  <line x1="195" y1="50" x2="230" y2="50" class="bond" />

  <!-- COOH group -->
  <g transform="translate(240, 60)">
    <text x="0" y="0" class="chem-text">COOH</text>
  </g>

  <!-- Vertical Bond down to R group -->
  <line x1="170" y1="70" x2="170" y2="105" class="bond" />

  <!-- R group -->
  <g transform="translate(160, 140)">
    <text x="0" y="0" class="chem-text">R</text>
  </g>
</svg>
