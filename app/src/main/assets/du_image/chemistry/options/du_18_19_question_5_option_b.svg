<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="100%" height="100%">
  <style>
    .label-text {
      font-family: 'Times New Roman', Times, serif;
      font-size: 26px;
      font-style: italic;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .axis {
      stroke: #000000;
      stroke-width: 2.5;
      stroke-linecap: round;
      fill: none;
    }
    .graph-line {
      stroke: #000000;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .arrow-head {
      fill: #000000;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="none" />

  <g transform="translate(40, 20)">
    <!-- Y-axis (a) -->
    <line x1="40" y1="180" x2="40" y2="30" class="axis" />
    <polygon points="33,35 40,20 47,35" class="arrow-head" />
    <text x="18" y="70" class="label-text">a</text>

    <!-- X-axis (r) -->
    <line x1="40" y1="180" x2="200" y2="180" class="axis" />
    <polygon points="195,173 210,180 195,187" class="arrow-head" />
    <text x="215" y="180" class="label-text">r</text>

    <!-- Straight Line passing through origin -->
    <line x1="40" y1="180" x2="165" y2="45" class="graph-line" />
  </g>
</svg>
