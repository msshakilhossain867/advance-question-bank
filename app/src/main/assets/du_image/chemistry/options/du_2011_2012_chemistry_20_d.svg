<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="100%" height="100%">
  <style>
    .ring {
      stroke: #000000;
      stroke-width: 3.5;
      fill: none;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .charge-line {
      stroke: #000000;
      stroke-width: 3;
      stroke-linecap: round;
    }
  </style>

  <!-- Benzene Hexagon Ring -->
  <polygon points="100,68 160,103 160,173 100,208 40,173 40,103" class="ring" />

  <!-- Inner Aromatic Ring (Ellipse/Circle) -->
  <ellipse cx="100" cy="138" rx="42" ry="49" class="ring" />

  <!-- Top Line / Bond -->
  <line x1="100" y1="68" x2="100" y2="22" class="charge-line" />

  <!-- Horizontal Crossbar for Positive Charge (+) -->
  <line x1="88" y1="36" x2="112" y2="36" class="charge-line" />
</svg>
