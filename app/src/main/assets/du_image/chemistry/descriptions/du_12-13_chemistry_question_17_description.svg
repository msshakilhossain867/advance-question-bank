<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 180" width="100%" height="100%">
  <defs>
    <style>
      .chem-text {
        font-family: 'Times New Roman', Times, serif;
        font-size: 24px;
        fill: #000000;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .num-text {
        font-family: 'Times New Roman', Times, serif;
        font-size: 16px;
        fill: #000000;
        text-anchor: end;
        dominant-baseline: central;
      }
      .bond-line {
        stroke: #000000;
        stroke-width: 2;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Chemical Chain Structure -->
  <g transform="translate(30, 45)">
    <!-- C1: 1CH3 -->
    <g transform="translate(35, 0)">
      <text x="-32" y="-10" class="num-text">1</text>
      <text x="0" y="0" class="chem-text">CH<tspan dy="6" font-size="16">3</tspan></text>
    </g>

    <line x1="68" y1="0" x2="88" y2="0" class="bond-line" />

    <!-- C2: 2CH - Cl -->
    <g transform="translate(125, 0)">
      <text x="-27" y="-10" class="num-text">2</text>
      <text x="0" y="0" class="chem-text">CH</text>
      <line x1="0" y1="14" x2="0" y2="36" class="bond-line" />
      <text x="0" y="52" class="chem-text">Cl</text>
    </g>

    <line x1="158" y1="0" x2="178" y2="0" class="bond-line" />

    <!-- C3: 3CH - Br -->
    <g transform="translate(215, 0)">
      <text x="-27" y="-10" class="num-text">3</text>
      <text x="0" y="0" class="chem-text">CH</text>
      <line x1="0" y1="14" x2="0" y2="36" class="bond-line" />
      <text x="0" y="52" class="chem-text">Br</text>
    </g>

    <line x1="248" y1="0" x2="268" y2="0" class="bond-line" />

    <!-- C4: 4CH2 -->
    <g transform="translate(315, 0)">
      <text x="-32" y="-10" class="num-text">4</text>
      <text x="0" y="0" class="chem-text">CH<tspan dy="6" font-size="16">2</tspan></text>
    </g>

    <line x1="355" y1="0" x2="375" y2="0" class="bond-line" />

    <!-- C5: 5CH - CH3 -->
    <g transform="translate(410, 0)">
      <text x="-27" y="-10" class="num-text">5</text>
      <text x="0" y="0" class="chem-text">CH</text>
      <line x1="0" y1="14" x2="0" y2="36" class="bond-line" />
      <text x="0" y="52" class="chem-text">CH<tspan dy="6" font-size="16">3</tspan></text>
    </g>

    <line x1="440" y1="0" x2="460" y2="0" class="bond-line" />

    <!-- C6: 6CH3 -->
    <g transform="translate(500, 0)">
      <text x="-32" y="-10" class="num-text">6</text>
      <text x="0" y="0" class="chem-text">CH<tspan dy="6" font-size="16">3</tspan></text>
    </g>
  </g>

  <!-- IUPAC Name Subtitle -->
  <g transform="translate(290, 145)">
    <text x="0" y="0" class="chem-text">3- bromo-2-chloro-5-methyl heptane</text>
  </g>
</svg>
