<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" width="100%" height="100%">
  <style>
    .chem-text { font-family: 'Times New Roman', serif; font-size: 22px; fill: #000; }
    .label-eng { font-family: 'Times New Roman', serif; font-size: 20px; fill: #000; }
    .label-bengali { font-family: 'Kalpurush', 'Siyam Rupali', 'Hind Siliguri', sans-serif; font-size: 20px; font-weight: bold; fill: #000; }
    .bond-line { stroke: #000; stroke-width: 2; stroke-linecap: round; }
    .lone-pair { fill: #000; }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="none" />

  <g transform="translate(20, 20)">

    <!-- TOP-LEFT: SF4 (See-Saw) -->
    <g transform="translate(10, 10)">
      <!-- Central Atom S -->
      <text x="120" y="80" class="chem-text" text-anchor="middle">S</text>
      
      <!-- Lone Pair on S -->
      <circle cx="114" cy="54" r="2.5" class="lone-pair" />
      <circle cx="126" cy="54" r="2.5" class="lone-pair" />

      <!-- Horizontal Bonds (Axial/Equatorial F) -->
      <line x1="102" y1="73" x2="65" y2="73" class="bond-line" />
      <text x="50" y="80" class="chem-text" text-anchor="middle">F</text>

      <line x1="138" y1="73" x2="175" y2="73" class="bond-line" />
      <text x="190" y="80" class="chem-text" text-anchor="middle">F</text>

      <!-- Bottom Angular Bonds -->
      <line x1="110" y1="90" x2="80" y2="120" class="bond-line" />
      <text x="70" y="135" class="chem-text" text-anchor="middle">F</text>

      <line x1="130" y1="90" x2="160" y2="120" class="bond-line" />
      <text x="170" y="135" class="chem-text" text-anchor="middle">F</text>

      <!-- Label -->
      <text x="120" y="170" class="label-eng" text-anchor="middle">See-Saw</text>
    </g>

    <!-- TOP-RIGHT: BF3 (Trigonal Planar) -->
    <g transform="translate(260, 10)">
      <!-- Central Atom B -->
      <text x="120" y="80" class="chem-text" text-anchor="middle">B</text>

      <!-- Top-Left Bond -->
      <line x1="108" y1="68" x2="72" y2="35" class="bond-line" />
      <text x="60" y="30" class="chem-text" text-anchor="middle">F</text>

      <!-- Top-Right Bond -->
      <line x1="132" y1="68" x2="168" y2="35" class="bond-line" />
      <text x="180" y="30" class="chem-text" text-anchor="middle">F</text>

      <!-- Vertical Down Bond -->
      <line x1="120" y1="88" x2="120" y2="125" class="bond-line" />
      <text x="120" y="148" class="chem-text" text-anchor="middle">F</text>

      <!-- Label -->
      <text x="120" y="180" class="label-bengali" text-anchor="middle">সমতলীয় ত্রিভুজাকার</text>
    </g>

    <!-- BOTTOM-LEFT: SiF4 (Tetrahedral) -->
    <g transform="translate(10, 200)">
      <!-- Central Atom Si -->
      <text x="120" y="80" class="chem-text" text-anchor="middle">Si</text>

      <!-- Vertical Top Bond -->
      <line x1="120" y1="58" x2="120" y2="20" class="bond-line" />
      <text x="120" y="12" class="chem-text" text-anchor="middle">F</text>

      <!-- Vertical Bottom Bond -->
      <line x1="120" y1="88" x2="120" y2="125" class="bond-line" />
      <text x="120" y="148" class="chem-text" text-anchor="middle">F</text>

      <!-- Bottom-Left Bond -->
      <line x1="108" y1="82" x2="72" y2="115" class="bond-line" />
      <text x="60" y="128" class="chem-text" text-anchor="middle">F</text>

      <!-- Bottom-Right Bond -->
      <line x1="132" y1="82" x2="168" y2="115" class="bond-line" />
      <text x="180" y="128" class="chem-text" text-anchor="middle">F</text>

      <!-- Label -->
      <text x="120" y="180" class="label-bengali" text-anchor="middle">চতুস্তলকীয়</text>
    </g>

    <!-- BOTTOM-RIGHT: XeF4 (Square Planar) -->
    <g transform="translate(260, 200)">
      <!-- Central Atom Xe -->
      <text x="120" y="80" class="chem-text" text-anchor="middle">Xe</text>

      <!-- Top Lone Pair -->
      <circle cx="112" cy="62" r="2.5" class="lone-pair" />
      <circle cx="128" cy="62" r="2.5" class="lone-pair" />

      <!-- Bottom Lone Pair -->
      <circle cx="112" cy="88" r="2.5" class="lone-pair" />
      <circle cx="128" cy="88" r="2.5" class="lone-pair" />

      <!-- Top-Left Bond -->
      <line x1="102" y1="68" x2="68" y2="40" class="bond-line" />
      <text x="58" y="35" class="chem-text" text-anchor="middle">F</text>

      <!-- Top-Right Bond -->
      <line x1="138" y1="68" x2="172" y2="40" class="bond-line" />
      <text x="182" y="35" class="chem-text" text-anchor="middle">F</text>

      <!-- Bottom-Left Bond -->
      <line x1="102" y1="82" x2="68" y2="110" class="bond-line" />
      <text x="58" y="125" class="chem-text" text-anchor="middle">F</text>

      <!-- Bottom-Right Bond -->
      <line x1="138" y1="82" x2="172" y2="110" class="bond-line" />
      <text x="182" y="125" class="chem-text" text-anchor="middle">F</text>

      <!-- Label -->
      <text x="120" y="180" class="label-bengali" text-anchor="middle">সমতলীয় বর্গাকার</text>
    </g>

  </g>
</svg>
