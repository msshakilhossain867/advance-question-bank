<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', 'Kalpurush', sans-serif;">

  <!-- TOP TEXT SECTION -->
  <g transform="translate(30, 40)" font-size="19" fill="#000000">
    <text x="0" y="0">
      সাধারণত <tspan font-style="italic">ab</tspan>C=C<tspan font-style="italic">ab</tspan>, <tspan font-style="italic">ab</tspan>C=C<tspan font-style="italic">ad</tspan> এবং <tspan font-style="italic">ab</tspan>C=C<tspan font-style="italic">de</tspan>
    </text>
    <text x="0" y="32">
      সংকেতযুক্ত প্রতিস্থাপিত অ্যালকিন জ্যামিতিক সমাণুতা প্রদর্শন
    </text>
    <text x="0" y="64">
      করে। জ্যামিতিক সমাণুতাকে সিস-ট্রান্স সমাণুতা বলা হয়।
    </text>
  </g>

  <!-- MOLECULAR STRUCTURES SECTION -->
  <g transform="translate(0, 150)">

    <!-- CIS-ISOMER (Left Side) -->
    <g transform="translate(70, 20)">
      <!-- Central Double Bond C = C -->
      <text x="110" y="105" font-size="26" font-weight="bold">C</text>
      <line x1="135" y1="95" x2="195" y2="95" stroke="#000000" stroke-width="2.5"/>
      <line x1="135" y1="105" x2="195" y2="105" stroke="#000000" stroke-width="2.5"/>
      <text x="200" y="105" font-size="26" font-weight="bold">C</text>

      <!-- Left Carbon Bonds -->
      <!-- Top-Left Bond to H -->
      <line x1="110" y1="85" x2="65" y2="50" stroke="#000000" stroke-width="2.5"/>
      <text x="45" y="45" font-size="22">H</text>

      <!-- Bottom-Left Bond to H3C -->
      <line x1="110" y1="115" x2="65" y2="150" stroke="#000000" stroke-width="2.5"/>
      <text x="10" y="170" font-size="22">H<tspan font-size="16" dy="4">3</tspan><tspan font-size="22" dy="-4">C</tspan></text>

      <!-- Right Carbon Bonds -->
      <!-- Top-Right Bond to H -->
      <line x1="220" y1="85" x2="265" y2="50" stroke="#000000" stroke-width="2.5"/>
      <text x="270" y="45" font-size="22">H</text>

      <!-- Bottom-Right Bond to CH3 -->
      <line x1="220" y1="115" x2="265" y2="150" stroke="#000000" stroke-width="2.5"/>
      <text x="270" y="170" font-size="22">CH<tspan font-size="16" dy="4">3</tspan></text>

      <!-- Label -->
      <text x="160" y="230" font-size="22" font-weight="bold" text-anchor="middle">cis-সমাণু</text>
    </g>

    <!-- TRANS-ISOMER (Right Side) -->
    <g transform="translate(380, 20)">
      <!-- Central Double Bond C = C -->
      <text x="110" y="105" font-size="26" font-weight="bold">C</text>
      <line x1="135" y1="95" x2="195" y2="95" stroke="#000000" stroke-width="2.5"/>
      <line x1="135" y1="105" x2="195" y2="105" stroke="#000000" stroke-width="2.5"/>
      <text x="200" y="105" font-size="26" font-weight="bold">C</text>

      <!-- Left Carbon Bonds -->
      <!-- Top-Left Bond to H -->
      <line x1="110" y1="85" x2="65" y2="50" stroke="#000000" stroke-width="2.5"/>
      <text x="45" y="45" font-size="22">H</text>

      <!-- Bottom-Left Bond to H3C -->
      <line x1="110" y1="115" x2="65" y2="150" stroke="#000000" stroke-width="2.5"/>
      <text x="10" y="170" font-size="22">H<tspan font-size="16" dy="4">3</tspan><tspan font-size="22" dy="-4">C</tspan></text>

      <!-- Right Carbon Bonds -->
      <!-- Top-Right Bond to CH3 -->
      <line x1="220" y1="85" x2="265" y2="50" stroke="#000000" stroke-width="2.5"/>
      <text x="270" y="45" font-size="22">CH<tspan font-size="16" dy="4">3</tspan></text>

      <!-- Bottom-Right Bond to H -->
      <line x1="220" y1="115" x2="265" y2="150" stroke="#000000" stroke-width="2.5"/>
      <text x="270" y="170" font-size="22">H</text>

      <!-- Label -->
      <text x="160" y="230" font-size="22" font-weight="bold" text-anchor="middle">trans-সমাণু</text>
    </g>

  </g>
</svg>
