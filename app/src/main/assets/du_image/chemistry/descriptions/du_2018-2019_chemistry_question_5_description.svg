<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', 'Kalpurush', 'Siyam Rupali', serif;">
  <style>
    .bengali-text { font-family: 'Kalpurush', 'Siyam Rupali', 'Times New Roman', serif; fill: #000000; font-size: 16px; }
    .chem-text { font-family: 'Times New Roman', serif; fill: #000000; font-size: 17px; }
    .sub { font-size: 11px; }
    .bond { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .arrow { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; }
  </style>

  <!-- Top Bengali Description -->
  <text x="30" y="30" class="bengali-text">
    ফেনলকে গাঢ় <tspan font-family="Times New Roman">HNO</tspan><tspan font-family="Times New Roman" baseline-shift="sub" class="sub">3</tspan> ও <tspan font-family="Times New Roman">H</tspan><tspan font-family="Times New Roman" baseline-shift="sub" class="sub">2</tspan><tspan font-family="Times New Roman">SO</tspan><tspan font-family="Times New Roman" baseline-shift="sub" class="sub">4</tspan> সহ সরাসরি নাইট্রেশন
  </text>
  <text x="30" y="55" class="bengali-text">
    করলে পিকরিক এসিড উৎপন্ন হয়।
  </text>

  <!-- Chemical Reaction Equation -->

  <!-- 1. Phenol Molecule -->
  <g transform="translate(30, 80)">
    <!-- OH group -->
    <text x="28" y="22" class="chem-text">OH</text>
    <!-- Bond to ring -->
    <line x1="38" y1="26" x2="38" y2="40" class="bond" />
    <!-- Benzene Ring -->
    <polygon points="38,40 55,50 55,70 38,80 21,70 21,50" class="bond" />
    <!-- Inner Circle -->
    <circle cx="38" cy="60" r="11" class="bond" />
  </g>

  <!-- Plus Sign -->
  <text x="100" y="146" class="chem-text" font-size="20">+</text>

  <!-- Reagent: HNO3 (Conc) -->
  <g transform="translate(118, 126)">
    <text x="0" y="20" class="chem-text">HNO<tspan baseline-shift="sub" class="sub">3</tspan> (Conc)</text>
  </g>

  <!-- Reaction Arrow with Reagents -->
  <g transform="translate(235, 110)">
    <!-- Above Arrow: গাঢ় H2SO4 -->
    <text x="25" y="15" class="bengali-text" font-size="15">গাঢ় <tspan font-family="Times New Roman" font-size="16px">H</tspan><tspan font-family="Times New Roman" baseline-shift="sub" class="sub">2</tspan><tspan font-family="Times New Roman" font-size="16px">SO</tspan><tspan font-family="Times New Roman" baseline-shift="sub" class="sub">4</tspan></text>
    
    <!-- Arrow Line -->
    <line x1="5" y1="28" x2="95" y2="28" class="arrow" />
    <polygon points="95,25 102,28 95,31" fill="#000000" />
    
    <!-- Below Arrow: 90°C -->
    <text x="35" y="45" class="chem-text" font-size="15">90°C</text>
  </g>

  <!-- 2. Picric Acid Molecule -->
  <g transform="translate(355, 80)">
    <!-- OH group (top) -->
    <text x="50" y="22" class="chem-text">OH</text>
    <line x1="60" y1="26" x2="60" y2="40" class="bond" />

    <!-- Left NO2 group (at position 2/6) -->
    <text x="10" y="32" class="chem-text">NO<tspan baseline-shift="sub" class="sub">2</tspan></text>
    <line x1="45" y1="36" x2="51" y2="48" class="bond" />

    <!-- Right NO2 group (at position 2/6) -->
    <text x="75" y="32" class="chem-text">NO<tspan baseline-shift="sub" class="sub">2</tspan></text>
    <line x1="75" y1="36" x2="69" y2="48" class="bond" />

    <!-- Benzene Ring -->
    <polygon points="60,40 77,50 77,70 60,80 43,70 43,50" class="bond" />
    <!-- Inner Circle -->
    <circle cx="60" cy="60" r="11" class="bond" />

    <!-- Bottom NO2 group (at position 4) -->
    <line x1="60" y1="80" x2="68" y2="92" class="bond" />
    <text x="70" y="102" class="chem-text">NO<tspan baseline-shift="sub" class="sub">2</tspan></text>
  </g>
</svg>
