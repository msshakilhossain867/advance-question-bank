<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <style>
      .label-text {
        font-family: 'Times New Roman', Times, serif;
        font-weight: normal;
        fill: #000000;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .axis-line {
        stroke: #000000;
        stroke-width: 2.2;
        stroke-linecap: square;
      }
      .graph-line {
        stroke: #000000;
        stroke-width: 2;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- ==================== GRAPH AXES ==================== -->
  <g transform="translate(140, 60)">
    <!-- Y-Axis (PV) -->
    <line x1="0" y1="180" x2="0" y2="20" class="axis-line" />
    
    <!-- X-Axis (1/p) -->
    <line x1="0" y1="180" x2="200" y2="180" class="axis-line" />

    <!-- Y-Axis Label: PV -->
    <text x="-35" y="100" class="label-text" font-size="26">PV</text>

    <!-- Horizontal Isotherm Lines -->
    <!-- T3 Line (Top) -->
    <line x1="0" y1="40" x2="190" y2="40" class="graph-line" />
    <text x="210" y="40" class="label-text" font-size="22">T<tspan dy="6" font-size="16">3</tspan></text>

    <!-- T2 Line (Middle) -->
    <line x1="0" y1="85" x2="190" y2="85" class="graph-line" />
    <text x="210" y="85" class="label-text" font-size="22">T<tspan dy="6" font-size="16">2</tspan></text>

    <!-- T1 Line (Bottom) -->
    <line x1="0" y1="130" x2="190" y2="130" class="graph-line" />
    <text x="210" y="130" class="label-text" font-size="22">T<tspan dy="6" font-size="16">1</tspan></text>

    <!-- X-Axis Label: 1/p -->
    <g transform="translate(100, 215)">
      <text x="0" y="-12" class="label-text" font-size="22">1</text>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#000000" stroke-width="2" />
      <text x="0" y="18" class="label-text" font-size="22">p</text>
    </g>
  </g>

  <!-- ==================== TEMPERATURE CONDITION ==================== -->
  <text x="370" y="45" class="label-text" font-size="22">
    T<tspan dy="5" font-size="15">1</tspan><tspan dy="-5"> &lt; T</tspan><tspan dy="5" font-size="15">2</tspan><tspan dy="-5"> &lt; T</tspan><tspan dy="5" font-size="15">3</tspan>
  </text>
</svg>
