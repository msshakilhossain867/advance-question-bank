<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="100%" height="100%">
  <defs>
    <!-- Arrowhead Marker for Lines -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .chem-text { font-family: 'Times New Roman', serif; font-size: 26px; fill: #000; }
    .sub-text { font-size: 18px; }
    .sup-text { font-size: 18px; }
    .label-text { font-family: 'Times New Roman', serif; font-size: 22px; fill: #000; }
    .line-path { fill: none; stroke: #000; stroke-width: 2; }
  </style>

  <!-- Top Bracket (H2O to OH-) -->
  <path d="M 285,80 L 285,40 L 415,40 L 415,80" class="line-path" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="350" y="30" class="label-text" text-anchor="middle">Conjugate Pair</text>

  <!-- Chemical Equation -->
  <g transform="translate(0, 120)">
    <!-- NH3 -->
    <text x="70" y="0" class="chem-text">NH<tspan baseline-shift="sub" class="sub-text">3</tspan></text>
    
    <!-- + -->
    <text x="165" y="-2" class="chem-text">+</text>
    
    <!-- H2O -->
    <text x="215" y="0" class="chem-text">H<tspan baseline-shift="sub" class="sub-text">2</tspan>O</text>
    
    <!-- Arrow -->
    <path d="M 310,-8 L 345,-8" class="line-path" marker-end="url(#arrow)"/>
    
    <!-- NH4+ -->
    <text x="370" y="0" class="chem-text">NH<tspan baseline-shift="sub" class="sub-text">4</tspan><tspan baseline-shift="super" class="sup-text">+</tspan></text>
    
    <!-- + -->
    <text x="440" y="-2" class="chem-text">+</text>
    
    <!-- OH- -->
    <text x="460" y="0" class="chem-text">OH<tspan baseline-shift="super" class="sup-text">-</tspan></text>
  </g>

  <!-- Bottom Bracket (NH3 to NH4+) -->
  <path d="M 100,135 L 100,180 L 390,180 L 390,135" class="line-path" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="245" y="210" class="label-text" text-anchor="middle">Conjugate Pair</text>
</svg>
