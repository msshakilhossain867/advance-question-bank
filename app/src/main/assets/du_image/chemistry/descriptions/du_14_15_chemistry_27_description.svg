<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 320" width="100%" height="100%">
  <defs>
    <style>
      .text-title { font-family: 'SolaimanLipi', 'Kalpurush', 'Noto Sans Bengali', sans-serif; font-size: 18px; fill: #1a1a1a; }
      .text-label { font-family: 'SolaimanLipi', 'Kalpurush', 'Noto Sans Bengali', sans-serif; font-size: 17px; fill: #111111; font-weight: bold; }
      .text-chem { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #000000; }
      .chem-line { stroke: #000000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-line { stroke: #000000; stroke-width: 1.5; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="8 4, 0 0, 2 4, 0 8" fill="#000000" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Text Section -->
  <text x="30" y="40" class="text-title">টলুইন অ্যালিফেটিক ও অ্যারোমেটিক উভয় ধর্ম প্রদর্শন করে।</text>
  <text x="30" y="70" class="text-title">কেননা, এর গঠনে অ্যালিফেটিক ও অ্যারোমেটিক উভয়</text>
  <text x="30" y="100" class="text-title">অংশই বিদ্যমান।</text>

  <!-- Chemical Structure: Toluene -->
  <g transform="translate(180, 120)">
    <!-- CH3 Group -->
    <text x="0" y="20" class="text-chem" text-anchor="middle">CH<tspan font-size="14" dy="4">3</tspan></text>
    
    <!-- Bond connecting CH3 to Benzene ring -->
    <line x1="0" y1="28" x2="0" y2="55" class="chem-line" />

    <!-- Benzene Ring (Hexagon) -->
    <!-- Points calculated for regular hexagon centered at X=0, Y=105, radius ~40 -->
    <polygon points="0,65 35,85 35,125 0,145 -35,125 -35,85" fill="none" class="chem-line" />
    
    <!-- Inner Circle for Aromaticity -->
    <circle cx="0" cy="105" r="23" fill="none" class="chem-line" />
  </g>

  <!-- Diagram Labels and Pointer Arrows -->
  <!-- Upper Pointer (Aliphatic Part) -->
  <line x1="330" y1="136" x2="200" y2="136" class="arrow-line" />
  <text x="345" y="142" class="text-label">অ্যালিফেটিক অংশ</text>

  <!-- Lower Pointer (Aromatic Part) -->
  <line x1="330" y1="225" x2="195" y2="225" class="arrow-line" />
  <text x="345" y="231" class="text-label">অ্যারোমেটিক অংশ</text>

</svg>
