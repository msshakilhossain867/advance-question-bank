<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background-color: #ffffff; font-family: 'SolaimanLipi', 'Kalpurush', 'Noto Sans Bengali', Arial, sans-serif;">

  <!-- Header Text (Bengali) -->
  <text x="50" y="45" font-size="22" fill="#000000" font-weight="bold">
    বেনজিনের সাথে CH<tspan baseline-shift="sub" font-size="16">3</tspan>Cl ও অনাদ্র AlCl<tspan baseline-shift="sub" font-size="16">3</tspan> এর বিক্রিয়া
  </text>
  <text x="50" y="80" font-size="22" fill="#000000" font-weight="bold">
    ফিডেল ক্রাফট বিক্রিয়া নামে পরিচিত। বিক্রিয়া কৌশল নিম্নরূপ:
  </text>

  <!-- Reaction 1: Complex Formation -->
  <g transform="translate(50, 130)">
    <!-- CH3Cl + AlCl3 -->
    <text x="0" y="30" font-size="22" font-weight="bold" fill="#000">
      CH<tspan baseline-shift="sub" font-size="16">3</tspan>Cl + AlCl<tspan baseline-shift="sub" font-size="16">3</tspan>
    </text>

    <!-- Arrow 1 -->
    <line x1="210" y1="23" x2="245" y2="23" stroke="#000" stroke-width="2.5" />
    <polygon points="245,18 255,23 245,28" fill="#000" />

    <!-- Bracketed Intermediate [H3C-Cl -> AlCl3] -->
    <text x="260" y="30" font-size="26" font-weight="normal" fill="#000">[</text>
    <text x="270" y="30" font-size="22" font-weight="bold" fill="#000">
      H<tspan baseline-shift="sub" font-size="16">3</tspan>C—Cl
    </text>
    <!-- Coordination Arrow -->
    <line x1="375" y1="23" x2="400" y2="23" stroke="#000" stroke-width="2" />
    <polygon points="400,19 407,23 400,27" fill="#000" />
    <text x="412" y="30" font-size="22" font-weight="bold" fill="#000">
      AlCl<tspan baseline-shift="sub" font-size="16">3</tspan>
    </text>
    <text x="475" y="30" font-size="26" font-weight="normal" fill="#000">]</text>

    <!-- Equilibrium/Equivalence Arrow -->
    <line x1="495" y1="20" x2="525" y2="20" stroke="#000" stroke-width="2" />
    <polygon points="525,17 532,20 525,23" fill="#000" />
    <line x1="495" y1="26" x2="525" y2="26" stroke="#000" stroke-width="2" />
    <polygon points="495,23 488,26 495,29" fill="#000" />

    <!-- AlCl4- + CH3+ -->
    <text x="545" y="30" font-size="22" font-weight="bold" fill="#000">
      AlCl<tspan baseline-shift="sub" font-size="16">4</tspan><tspan baseline-shift="super" font-size="16">-</tspan> + CH<tspan baseline-shift="sub" font-size="16">3</tspan><tspan baseline-shift="super" font-size="16">+</tspan>
    </text>

    <!-- Label: Unstable Intermediate State -->
    <text x="270" y="75" font-size="20" font-weight="bold" fill="#000">
      অস্থায়ী মধ্যবর্তী অবস্থা
    </text>
  </g>

  <!-- Reaction 2: Electrophilic Attack & Sigma Complex -->
  <g transform="translate(50, 270)">
    <!-- Benzene Ring 1 -->
    <g transform="translate(50, 80)">
      <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="none" stroke="#000" stroke-width="2.5" />
      <circle cx="0" cy="0" r="20" fill="none" stroke="#000" stroke-width="2.5" />
    </g>

    <!-- + +CH3 -->
    <text x="105" y="88" font-size="24" font-weight="bold" fill="#000">+</text>
    <text x="130" y="88" font-size="22" font-weight="bold" fill="#000">
      <tspan baseline-shift="super" font-size="16">+</tspan>CH<tspan baseline-shift="sub" font-size="16">3</tspan>
    </text>

    <!-- Arrow 2 -->
    <line x1="220" y1="80" x2="290" y2="80" stroke="#000" stroke-width="2.5" />
    <polygon points="290,74 302,80 290,86" fill="#000" />

    <!-- Sigma Complex (arenium ion) -->
    <g transform="translate(370, 80)">
      <!-- Ring Hexagon -->
      <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="none" stroke="#000" stroke-width="2.5" />
      
      <!-- Partial Delocalized Positive Charge (Arc with +) -->
      <path d="M -20,10 A 20 20 0 1 0 20,10" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="4 2" />
      <text x="-7" y="5" font-size="20" font-weight="bold" fill="#000">+</text>

      <!-- Bonds to CH3 and H at top carbon -->
      <line x1="0" y1="-40" x2="-25" y2="-65" stroke="#000" stroke-width="2.5" />
      <text x="-55" y="-68" font-size="20" font-weight="bold" fill="#000">CH<tspan baseline-shift="sub" font-size="14">3</tspan></text>

      <line x1="0" y1="-40" x2="25" y2="-65" stroke="#000" stroke-width="2.5" />
      <text x="28" y="-68" font-size="20" font-weight="bold" fill="#000">H</text>
    </g>

    <!-- Arrow 3 with AlCl4- on top -->
    <g transform="translate(435, 80)">
      <text x="25" y="-15" font-size="20" font-weight="bold" fill="#000">
        AlCl<tspan baseline-shift="sub" font-size="14">4</tspan><tspan baseline-shift="super" font-size="14">-</tspan>
      </text>
      <line x1="10" y1="0" x2="110" y2="0" stroke="#000" stroke-width="2.5" />
      <polygon points="110,-6 122,0 110,6" fill="#000" />
    </g>

    <!-- Toluene Ring + HCl + AlCl3 -->
    <g transform="translate(610, 80)">
      <!-- Benzene Ring -->
      <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="none" stroke="#000" stroke-width="2.5" />
      <circle cx="0" cy="0" r="20" fill="none" stroke="#000" stroke-width="2.5" />
      
      <!-- Top CH3 group -->
      <line x1="0" y1="-40" x2="0" y2="-60" stroke="#000" stroke-width="2.5" />
      <text x="-18" y="-65" font-size="20" font-weight="bold" fill="#000">CH<tspan baseline-shift="sub" font-size="14">3</tspan></text>
    </g>

    <!-- + HCl + AlCl3 -->
    <text x="660" y="88" font-size="22" font-weight="bold" fill="#000">
      + HCl + AlCl<tspan baseline-shift="sub" font-size="16">3</tspan>
    </text>

    <!-- Label: Sigma Complex -->
    <text x="325" y="175" font-size="22" font-weight="bold" fill="#000">
      σ- জটিল
    </text>
  </g>

</svg>
