<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <!-- Arrowhead Marker for Reaction Arrow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <style>
    .chem-text { font-family: 'Times New Roman', serif; font-size: 22px; fill: #000; }
    .bengali-text { font-family: 'Kalpurush', 'Siyam Rupali', 'Hind Siliguri', sans-serif; font-size: 20px; font-weight: bold; fill: #000; }
    .sub-text { font-size: 14px; }
    .bond-line { stroke: #000; stroke-width: 2; stroke-linecap: round; }
    .reaction-arrow { stroke: #000; stroke-width: 2; stroke-linecap: round; }
    .benzene-ring { fill: none; stroke: #000; stroke-width: 2; stroke-linejoin: round; }
    .benzene-circle { fill: none; stroke: #000; stroke-width: 2; }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="none" />

  <g transform="translate(15, 15)">

    <!-- REACTION LINE 1: BENZAMIDE + Br2 + NaOH -->
    <g transform="translate(20, 20)">

      <!-- Benzene Ring Horizontal -->
      <g transform="translate(40, 40) rotate(90)">
        <polygon points="0,-26 22,-12 22,12 0,26 -22,12 -22,-12" class="benzene-ring" />
        <circle cx="0" cy="0" r="12" class="benzene-circle" />
      </g>

      <!-- Side Bond to CO-NH2 -->
      <line x1="66" y1="40" x2="92" y2="40" class="bond-line" />

      <!-- CO-NH2 + Br2 + NaOH -->
      <text x="96" y="47" class="chem-text">CO-NH<tspan class="sub-text">2</tspan> + Br<tspan class="sub-text">2</tspan> + NaOH</text>

      <!-- Reaction Arrow -->
      <line x1="330" y1="40" x2="415" y2="40" class="reaction-arrow" marker-end="url(#arrow)" />

    </g>

    <!-- REACTION LINE 2: ANILINE + NaBr + Na2CO3 + H2O -->
    <g transform="translate(20, 130)">

      <!-- Benzene Ring Horizontal -->
      <g transform="translate(40, 40) rotate(90)">
        <polygon points="0,-26 22,-12 22,12 0,26 -22,12 -22,-12" class="benzene-ring" />
        <circle cx="0" cy="0" r="12" class="benzene-circle" />
      </g>

      <!-- Side Bond to NH2 -->
      <line x1="66" y1="40" x2="92" y2="40" class="bond-line" />

      <!-- NH2 + NaBr + Na2CO3 + H2O -->
      <text x="96" y="47" class="chem-text">NH<tspan class="sub-text">2</tspan> + NaBr + Na<tspan class="sub-text">2</tspan>CO<tspan class="sub-text">3</tspan> + H<tspan class="sub-text">2</tspan>O</text>

      <!-- Bengali Product Label: অ্যানিলিন -->
      <text x="25" y="102" class="bengali-text">অ্যানিলিন</text>

    </g>

  </g>
</svg>