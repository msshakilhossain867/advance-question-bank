<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="100%" height="100%">
  <defs>
    <style>
      .chem-text {
        font-family: 'Times New Roman', Times, serif;
        font-size: 26px;
        fill: #000000;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .label-text {
        font-family: 'Times New Roman', Times, serif;
        font-size: 24px;
        fill: #000000;
        text-anchor: middle;
      }
      .bengali-text {
        font-family: 'Siyam Rupali', 'Kalpurush', 'Noto Serif Bengali', 'Times New Roman', serif;
        font-size: 22px;
        fill: #000000;
        text-anchor: middle;
        dominant-baseline: alphabetic;
      }
      .bengali-left {
        font-family: 'Siyam Rupali', 'Kalpurush', 'Noto Serif Bengali', 'Times New Roman', serif;
        font-size: 22px;
        fill: #000000;
        text-anchor: start;
        dominant-baseline: alphabetic;
      }
      .bond-line {
        stroke: #000000;
        stroke-width: 2.5;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- ==================== COLUMN (a) ==================== -->
  <text x="90" y="45" class="label-text">(a)</text>

  <!-- Charge "+" above CH3 -->
  <text x="90" y="105" class="chem-text">+</text>
  <!-- Compound CH3 -->
  <text x="90" y="135" class="chem-text">CH<tspan dy="6" font-size="18">3</tspan></text>

  <!-- Subtitle (a) -->
  <text x="90" y="210" class="bengali-text">মিথাইল</text>
  <text x="90" y="240" class="bengali-text">কার্বোক্যাটায়ন</text>


  <!-- ==================== COLUMN (b) ==================== -->
  <text x="290" y="45" class="label-text">(b)</text>

  <!-- Group CH3 (top left), CH3 (bottom left) -->
  <text x="220" y="105" class="chem-text">CH<tspan dy="6" font-size="18">3</tspan></text>
  <text x="220" y="165" class="chem-text">CH<tspan dy="6" font-size="18">3</tspan></text>

  <!-- Angled bonds -->
  <line x1="250" y1="108" x2="295" y2="130" class="bond-line" />
  <line x1="250" y1="162" x2="295" y2="140" class="bond-line" />

  <!-- Charge "+" and Central C - H -->
  <text x="310" y="105" class="chem-text">+</text>
  <text x="310" y="135" class="chem-text">C</text>
  <line x1="325" y1="135" x2="355" y2="135" class="bond-line" />
  <text x="370" y="135" class="chem-text">H</text>

  <!-- Subtitle (b) -->
  <text x="290" y="225" class="bengali-text">2° কার্বোক্যাটায়ন</text>


  <!-- ==================== COLUMN (c) ==================== -->
  <text x="510" y="45" class="label-text">(c)</text>

  <!-- Group H (top left), H (bottom left) -->
  <text x="450" y="105" class="chem-text">H</text>
  <text x="450" y="165" class="chem-text">H</text>

  <!-- Angled bonds -->
  <line x1="465" y1="110" x2="505" y2="130" class="bond-line" />
  <line x1="465" y1="160" x2="505" y2="140" class="bond-line" />

  <!-- Charge "+" and Central C - CH3 -->
  <text x="520" y="105" class="chem-text">+</text>
  <text x="520" y="135" class="chem-text">C</text>
  <line x1="535" y1="135" x2="565" y2="135" class="bond-line" />
  <text x="605" y="135" class="chem-text">CH<tspan dy="6" font-size="18">3</tspan></text>

  <!-- Subtitle (c) -->
  <text x="510" y="225" class="bengali-text">1° কার্বোক্যাটায়ন</text>


  <!-- ==================== COLUMN (d) ==================== -->
  <text x="730" y="45" class="label-text">(d)</text>

  <!-- Top CH3, Central C, Bottom CH3 -->
  <text x="730" y="85" class="chem-text">CH<tspan dy="6" font-size="18">3</tspan></text>
  <line x1="730" y1="102" x2="730" y2="118" class="bond-line" />

  <!-- Left CH3 - C + -->
  <text x="670" y="135" class="chem-text">CH<tspan dy="6" font-size="18">3</tspan></text>
  <line x1="702" y1="135" x2="718" y2="135" class="bond-line" />
  <text x="730" y="135" class="chem-text">C</text>
  <text x="750" y="135" class="chem-text">+</text>

  <line x1="730" y1="152" x2="730" y2="168" class="bond-line" />
  <text x="730" y="185" class="chem-text">CH<tspan dy="6" font-size="18">3</tspan></text>

  <!-- Subtitle (d) -->
  <text x="730" y="240" class="bengali-text">3° কার্বোক্যাটায়ন</text>


  <!-- ==================== BOTTOM SUMMARY TEXT ==================== -->
  <text x="30" y="310" class="bengali-left">কার্বোক্যাটায়নের স্থায়িত্বের ক্রম: 3° &gt; 2° &gt; 1°,</text>
  <text x="30" y="355" class="bengali-left">অর্থাৎ</text>
</svg>
