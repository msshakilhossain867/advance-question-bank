<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="100%" height="100%">
  <style>
    .bengali-text {
      font-family: 'SolaimanLipi', 'Kalpurush', 'Siyam Rupali', 'FreeSerif', 'Arial', sans-serif;
      font-size: 26px;
      fill: #000000;
      font-weight: bold;
      dominant-baseline: central;
    }
    .chem-text {
      font-family: 'Times New Roman', Times, serif;
      font-size: 22px;
      font-weight: bold;
      fill: #000000;
      dominant-baseline: central;
    }
    .bond {
      stroke: #000000;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .ring {
      stroke: #000000;
      stroke-width: 2.5;
      fill: none;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Chemical Structure Group -->
  <g transform="translate(30, 10)">
    <!-- Benzene Ring Vertices:
         Top: (70, 60)
         Top-Right: (110, 83)
         Bottom-Right: (110, 129)
         Bottom: (70, 152)
         Bottom-Left: (30, 129)
         Top-Left: (30, 83)
    -->
    <polygon points="70,60 110,83 110,129 70,152 30,129 30,83" class="bond" />
    <circle cx="70" cy="106" r="26" class="ring" />

    <!-- Top Methyl Group (at position 1) -->
    <line x1="70" y1="60" x2="70" y2="30" class="bond" />
    <text x="70" y="15" class="chem-text" text-anchor="middle">CH<tspan font-size="16px" dy="4">3</tspan></text>

    <!-- Top-Right Methyl Group (at position 2) -->
    <line x1="110" y1="83" x2="138" y2="67" class="bond" />
    <text x="142" y="62" class="chem-text" text-anchor="start">CH<tspan font-size="16px" dy="4">3</tspan></text>

    <!-- Bottom Butyl Group (at position 4) -->
    <line x1="70" y1="152" x2="70" y2="182" class="bond" />
    <text x="70" y="200" class="chem-text" text-anchor="middle">CH<tspan font-size="16px" dy="4">2</tspan>CH<tspan font-size="16px" dy="0">2</tspan>CH<tspan font-size="16px" dy="0">2</tspan>CH<tspan font-size="16px" dy="0">3</tspan></text>
  </g>

  <!-- Text Section -->
  <text x="210" y="115" class="bengali-text">
    যৌগটির <tspan class="chem-text" font-size="26px">IUPAC</tspan> নাম হলো-
  </text>
</svg>
