<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 380" width="100%" height="100%">
  <style>
    .line {
      stroke: #000000;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .ray-line {
      stroke: #000000;
      stroke-width: 2.5;
      stroke-linecap: round;
      fill: none;
    }
    .text {
      font-family: Arial, sans-serif;
      font-size: 22px;
      font-weight: bold;
      fill: #000000;
    }
    .title-text {
      font-family: 'SolaimanLipi', Arial, sans-serif;
      font-size: 20px;
      font-weight: bold;
      fill: #000000;
    }
    .arrow-head {
      fill: #000000;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Title Text -->
  <text x="20" y="35" class="title-text">একটি আলোক রশ্মি চিত্রে প্রদর্শিত তিনটি মাধ্যম দিয়ে অতিক্রম</text>
  <text x="20" y="65" class="title-text">করছে। বেগগুলির কোন ক্রমটি সঠিক?</text>

  <g transform="translate(10, 40)">
    <!-- Interface Lines (Horizontal Separators) -->
    <line x1="50" y1="90" x2="250" y2="90" class="line" />
    <line x1="50" y1="170" x2="250" y2="170" class="line" />

    <!-- Light Ray Path -->
    <!-- Medium 1 to Medium 2 boundary at (120, 90) -->
    <!-- Medium 2 to Medium 3 boundary at (130, 170) -->
    <line x1="95" y1="20" x2="120" y2="90" class="ray-line" />
    <line x1="120" y1="90" x2="130" y2="170" class="ray-line" />
    <line x1="130" y1="170" x2="200" y2="245" class="ray-line" />

    <!-- Arrow 1 (in Medium 1) -->
    <g transform="translate(107, 55) rotate(70)">
      <polygon points="-6,-6 6,0 -6,6" class="arrow-head" />
    </g>

    <!-- Arrow 2 (in Medium 2) -->
    <g transform="translate(125, 130) rotate(83)">
      <polygon points="-6,-6 6,0 -6,6" class="arrow-head" />
    </g>

    <!-- Arrow 3 (in Medium 3) -->
    <g transform="translate(165, 207) rotate(47)">
      <polygon points="-6,-6 6,0 -6,6" class="arrow-head" />
    </g>

    <!-- Velocity Labels -->
    <text x="180" y="55" class="text">বেগ = v<tspan font-size="16" dy="5">1</tspan></text>
    <text x="190" y="135" class="text">বেগ = v<tspan font-size="16" dy="5">2</tspan></text>
    <text x="60" y="220" class="text">বেগ = v<tspan font-size="16" dy="5">3</tspan></text>
  </g>
</svg>
