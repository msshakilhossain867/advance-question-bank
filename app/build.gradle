plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.questionbank_practiceexam'
    compileSdk {
        version = release(37) {
            minorApiLevel = 1
        }
    }

    viewBinding {
        enabled = true
    }

    defaultConfig {
        applicationId "com.example.questionbank_practiceexam"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }


    sourceSets {
        main {
            res.srcDirs = [
                    'src/main/res',
                    'src/main/res/layouts/main',
                    'src/main/res/layouts/home',
                    'src/main/res/layouts/exam',
                    'src/main/res/layouts/mock',
                    'src/main/res/layouts/options',
                    'src/main/res/layouts/onboardings',
                    'src/main/res/layouts/years',
                    'src/main/res/layouts/units',
                    'src/main/res/layouts/subjects',
                    'src/main/res/layouts/questions',
                    'src/main/res/layouts/unlist',


                    // Drawable ফোল্ডার লিংক:
                    'src/main/res/drawables/home',
                    'src/main/res/drawables/exam',
                    'src/main/res/drawables/mock',
                    'src/main/res/drawables/options',
                    'src/main/res/drawables/onboardings',
                    'src/main/res/drawables/main',
                    'src/main/res/drawables/years',
                    'src/main/res/drawables/units',
                    'src/main/res/drawables/shares',
                    'src/main/res/drawables/subjects',
                    'src/main/res/drawables/questions',
                    'src/main/res/drawables/unlist'
            ]
        }
    }


}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}